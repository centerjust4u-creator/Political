<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Political Quiz 12 | Center JUST</title>
<style>
:root{--navy:#060E24;--blue:#2454BE;--gold:#D6B158;--white:#F4F7FC;--muted:#A9B6D3;--green:#3FA66B;--red:#DE4040;--parch:#F6EEDC;--ink:#1B2238}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--navy);color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 600px at 100% 0%,rgba(36,84,190,.38),transparent 60%),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%),var(--navy)}
.serif{font-family:Georgia,"Times New Roman",serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid rgba(214,177,88,.55)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:46px;height:46px;object-fit:contain;flex:none}
.brand b{font-family:Georgia,serif;font-size:1.25rem;letter-spacing:.06em;color:var(--gold);white-space:nowrap}
.tag{color:var(--muted);font-size:.78rem;font-style:italic}
.lbl{color:var(--gold);letter-spacing:.2em;font-size:.72rem;text-transform:uppercase;white-space:nowrap}
.bar{height:3px;background:rgba(214,177,88,.15)}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
main{flex:1;width:100%;max-width:780px;margin:0 auto;padding:26px 16px}
.panel{background:rgba(14,26,58,.72);border:1px solid rgba(214,177,88,.5);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.45);padding:28px 24px;backdrop-filter:blur(4px)}
.center{text-align:center}
.hero{width:170px;height:auto;margin:4px auto 6px;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.hero-name{font-family:Georgia,serif;color:var(--gold);font-size:1.6rem;letter-spacing:.12em;margin-bottom:18px}
h1{font-family:Georgia,serif;font-size:2.1rem;font-weight:700;margin:6px 0 10px}
.rule{width:70px;height:2px;background:var(--gold);margin:12px auto 16px}
.sub{color:var(--muted);max-width:480px;margin:0 auto 20px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.chip{border:1px solid rgba(214,177,88,.55);border-radius:999px;padding:6px 14px;font-size:.9rem;color:var(--white);background:rgba(214,177,88,.08)}
.chip b{color:var(--gold)}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(180deg,#E3C06C,#C99F43);color:#1A1405;border:0;border-radius:12px;padding:14px 34px;font-weight:700;font-size:1.05rem;letter-spacing:.04em;min-height:50px;box-shadow:0 6px 18px rgba(214,177,88,.25);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(214,177,88,.35)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.btn.ghost:hover{background:rgba(214,177,88,.12)}
.meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px;font-size:.95rem;color:var(--muted)}
.meta b{color:var(--gold)}
.qcard{background:var(--parch);color:var(--ink);border-radius:14px;padding:24px 22px;border:2px solid var(--gold);box-shadow:0 8px 26px rgba(0,0,0,.4);margin-bottom:16px;animation:rise .35s ease}
.qcard .kind{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#8A6A1F;margin-bottom:8px;font-weight:700}
.qcard h2{font-family:Georgia,serif;font-size:1.35rem;line-height:1.4;font-weight:700}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:58px;padding:12px 16px;border-radius:12px;background:rgba(244,247,252,.06);border:1px solid rgba(214,177,88,.45);color:var(--white);font-size:1.02rem;transition:transform .15s,background .15s,border-color .15s,opacity .3s}
.opt:hover:not(:disabled){background:rgba(214,177,88,.14);border-color:var(--gold);transform:translateX(4px)}
.opt:disabled{cursor:default}
.badge{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700;font-family:Georgia,serif}
.opt.correct{background:rgba(63,166,107,.22);border-color:var(--green)}
.opt.correct .badge{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{background:rgba(222,64,64,.2);border-color:var(--red);animation:shake .4s}
.opt.wrong .badge{background:var(--red);border-color:var(--red);color:#fff}
.opt.fade{opacity:.4}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:14px;padding:12px 16px;border-radius:12px;font-size:1rem;display:none}
.fb.show{display:block;animation:rise .3s}
.fb.ok{background:rgba(63,166,107,.18);border:1px solid var(--green)}
.fb.no{background:rgba(222,64,64,.16);border:1px solid var(--red)}
.fb b{font-family:Georgia,serif;font-size:1.1rem}
.nextrow{display:flex;justify-content:flex-end;margin-top:16px;min-height:50px}
.pct{font-family:Georgia,serif;font-size:4.2rem;color:var(--gold);font-weight:700;line-height:1.1}
.score{font-size:1.2rem;margin-bottom:6px}
.msg{color:var(--muted);margin-bottom:20px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}
h3{font-family:Georgia,serif;color:var(--gold);font-size:1.3rem;margin:26px 0 12px;text-align:left}
.rev{background:var(--parch);color:var(--ink);border-radius:12px;border-left:5px solid var(--red);padding:14px 16px;margin-bottom:12px;text-align:left}
.rev .n{font-size:.75rem;letter-spacing:.14em;color:#8A6A1F;font-weight:700}
.rev p{font-family:Georgia,serif;font-weight:700;margin:4px 0 8px}
.rev .y{color:#B02A2A}.rev .g{color:#1F7A47;font-weight:700}
.perfect{background:rgba(63,166,107,.15);border:1px solid var(--green);border-radius:12px;padding:16px;text-align:center}
footer{text-align:center;padding:16px;color:var(--gold);font-family:Georgia,serif;letter-spacing:.05em;border-top:1px solid rgba(214,177,88,.4);font-size:.95rem}
.hide{display:none!important}
@media(max-width:560px){.tag{display:none}.lbl{font-size:.62rem;letter-spacing:.12em}header{padding:10px 12px}h1{font-size:1.65rem}.panel{padding:22px 16px}.qcard h2{font-size:1.18rem}.pct{font-size:3.4rem}.brand b{font-size:1.05rem}.btn{width:100%}.nextrow .btn{width:100%}}
</style>
</head>

  $("rp").textContent=p+"%";
  $("rs").textContent=score+" / "+order.length+" correct";
  $("rm").textContent=p===100?"Outstanding! A perfect score.":p>=80?"Excellent work!":p>=60?"Good effort. Review the questions below and try again.":"Keep practicing. Review the questions below and try again.";
  var r=$("review");
  if(!missed.length){r.innerHTML='<div class="perfect serif">You answered every question correctly.</div>'}
  else{var h="<h3>Questions you answered incorrectly ("+missed.length+")</h3>";
    missed.forEach(function(m,i){h+='<div class="rev"><div class="n">QUESTION '+(i+1)+'</div><p>'+esc(m.q)+'</p><div class="y">Your answer: '+esc(m.yours)+'</div><div class="g">Correct answer: '+esc(m.right)+'</div></div>'});
    r.innerHTML=h}
  show("result");
}
$("startBtn").onclick=start;$("restart").onclick=start;$("next").onclick=next;
document.addEventListener("keydown",function(e){
  if(!$("quiz").classList.contains("hide")){
    if(e.key==="Enter"){next();return}
    var k=e.key.toUpperCase().charCodeAt(0)-65;
    if(e.key.length===1&&k>=0&&k<cur.opts.length)pick(k);
  }
});
})();
</script>
</body>
</html>
