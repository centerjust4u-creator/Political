<style>
:root{--navy:#060E24;--navy2:#0B1838;--royal:#2454BE;--white:#F4F7FC;--muted:#A9B6D3;--gold:#D6B158;--gold2:#F0D58C;
--parch:#F3EAD3;--parch2:#E9DCBC;--ink:#1D2238;--blue:#2F6FE0;--blueBg:#DCE8FC;--red:#C93A3A;--redBg:#F8DEDE;
--serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--sans);color:var(--white);background:var(--navy);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;
background:radial-gradient(ellipse 70% 55% at 100% 0%,rgba(36,84,190,.38),transparent 65%),
radial-gradient(ellipse 60% 50% at 0% 100%,rgba(214,177,88,.08),transparent 70%),
radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%),var(--navy)}
.wrap{max-width:780px;margin:0 auto;padding:0 18px 40px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:16px 0 12px;border-bottom:1px solid rgba(214,177,88,.45)}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px}
.brand img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.brand span,.under{font-family:var(--serif);font-size:11px;letter-spacing:.12em;color:var(--gold);font-weight:bold;white-space:nowrap}
.htitle{flex:1;min-width:0;font-family:var(--serif);font-size:17px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hlabel{font-size:11px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;white-space:nowrap}
.bar{height:3px;background:rgba(214,177,88,.15);border-radius:3px;margin:10px 0 26px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .45s ease}
main{flex:1}
.screen{display:none;animation:in .45s ease}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.glass{background:linear-gradient(160deg,rgba(18,34,74,.82),rgba(8,17,42,.88));border:1px solid rgba(214,177,88,.45);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.45);backdrop-filter:blur(6px)}
/* intro */
.intro{text-align:center;padding:34px 22px 34px}
.biglogo{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 8px 22px rgba(0,0,0,.55));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.intro .under,.res .under{display:block;font-size:15px;margin:8px 0 18px;letter-spacing:.2em}
.presents{font-size:11px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--serif);font-weight:normal;font-size:clamp(26px,6vw,38px);line-height:1.2;margin:8px 0 12px}
.rule{width:70px;height:2px;background:var(--gold);margin:0 auto 16px;border-radius:2px}
.sub{color:var(--muted);font-size:16px;line-height:1.5;max-width:460px;margin:0 auto 24px}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.stat{min-width:120px;padding:14px 16px;border-radius:12px;border:1px solid rgba(214,177,88,.35);background:rgba(6,14,36,.5)}
.stat b{display:block;font-family:var(--serif);font-size:28px;color:var(--gold);font-weight:normal}
.stat small{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.btn{font:600 16px var(--sans);border:none;border-radius:12px;padding:15px 30px;cursor:pointer;min-height:52px;transition:transform .15s,box-shadow .2s,background .2s}
.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1A1406;box-shadow:0 6px 20px rgba(214,177,88,.3)}
.gold:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(214,177,88,.42)}
.gold:active{transform:none}
.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.ghost:hover{background:rgba(214,177,88,.1)}
/* question */
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;color:var(--muted);gap:8px}
.meta b{color:var(--gold);font-weight:600}
.pill{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(214,177,88,.5);padding:4px 10px;border-radius:20px;white-space:nowrap}
.card{background:linear-gradient(170deg,var(--parch),var(--parch2));color:var(--ink);border-radius:16px;padding:26px 22px 22px;border:1px solid var(--gold);box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 0 4px rgba(214,177,88,.18)}
.qtext{font-family:var(--serif);font-size:clamp(18px,4.4vw,22px);line-height:1.45;margin-bottom:20px}
.opts{display:grid;gap:10px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:16px/1.4 var(--sans);color:var(--ink);background:rgba(255,255,255,.6);border:1.5px solid rgba(29,34,56,.18);border-radius:12px;padding:13px 14px;min-height:56px;cursor:pointer;transition:all .18s}
.opt:hover:not(:disabled){border-color:var(--gold);background:#fff;transform:translateX(3px)}
.opts.tf .opt{justify-content:center;font-weight:600;font-size:17px}
.opts.tf .opt:hover:not(:disabled){transform:translateY(-2px)}
.badge{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--sans);background:var(--navy);color:var(--gold)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--blueBg);border-color:var(--blue);color:#0E2D6B}
.opt.ok .badge{background:var(--blue);color:#fff}
.opt.bad{background:var(--redBg);border-color:var(--red);color:#6B1515;animation:shake .35s}
.opt.bad .badge{background:var(--red);color:#fff}
.opt.fade{opacity:.45}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{display:none;margin-top:18px;padding:14px 16px;border-radius:12px;border-left:4px solid;font-size:15px;line-height:1.5}
.fb.show{display:block;animation:in .3s ease}
.fb.ok{background:var(--blueBg);border-color:var(--blue);color:#0E2D6B}
.fb.bad{background:var(--redBg);border-color:var(--red);color:#6B1515}
.fb strong{display:block;font-family:var(--serif);font-size:17px;margin-bottom:4px}
.fb .ans{font-weight:600;margin-bottom:4px}
.next{display:flex;justify-content:flex-end;margin-top:18px}
.next .btn{visibility:hidden}
.next .btn.show{visibility:visible;animation:in .3s ease}
/* results */
.res{text-align:center;padding:34px 22px}
.res .biglogo{width:110px;height:110px}
.ring{width:170px;height:170px;margin:18px auto 10px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) var(--p,0%),rgba(214,177,88,.15) 0)}
.ring div{width:142px;height:142px;border-radius:50%;background:var(--navy2);display:grid;place-items:center;align-content:center}
.ring b{font-family:var(--serif);font-size:44px;color:var(--gold);font-weight:normal;line-height:1}
.ring small{color:var(--muted);font-size:13px;margin-top:4px}
.pct{font-size:15px;color:var(--muted);margin-bottom:6px}
.msg{font-family:var(--serif);font-size:20px;margin:10px 0 24px}
.chips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.chip{font-size:13px;padding:7px 14px;border-radius:20px;border:1px solid rgba(214,177,88,.45);color:var(--white);background:rgba(6,14,36,.5)}
.chip b{color:var(--gold)}
footer{text-align:center;font-size:12px;letter-spacing:.14em;color:var(--muted);padding-top:30px}
footer b{color:var(--gold);font-weight:normal}
@media (max-width:520px){
 .wrap{padding:0 12px 30px}
 .htitle{font-size:14px}
 .hlabel{display:none}
 .card{padding:20px 15px 16px}
 .opt{font-size:15px;padding:12px}
 .intro,.res{padding:26px 14px}
 .biglogo{width:120px;height:120px}
 .stat{min-width:92px;padding:12px}
 .btn{width:100%}
 .next .btn{width:auto}
}
</style>

var QUESTIONS = [{"t": "tf", "q": "The word \"democracy\" originates from the Greek words demos, meaning common people, and kratia, meaning power or rule.", "a": true, "e": "Democracy combines demos (the common people) and kratia (power or rule), so it literally means rule by the people."}, {"t": "tf", "q": "In a democratic system, political power belongs exclusively to elected representatives, and citizens have no right to hold them accountable.", "a": false, "e": "In a democracy, power ultimately rests with the people, and citizens hold their representatives accountable."}, {"t": "tf", "q": "Equality before the law is a central principle of democracy, meaning that no individual or group is above the law.", "a": true, "e": "Equality before the law is a core democratic principle: no person or group stands above the law."}, {"t": "tf", "q": "Direct democracy is considered the most practical form of government for large modern nations because it allows millions of citizens to vote on every issue efficiently.", "a": false, "e": "The size factor and the logistical difficulty of millions voting on every issue are the main challenges facing direct democracy in large nations."}, {"t": "tf", "q": "In indirect democracy, citizens elect representatives who make political decisions on their behalf.", "a": true, "e": "Indirect (representative) democracy works through elected representatives who decide on behalf of citizens."}, {"t": "tf", "q": "The hierarchical structure of institutions such as the military and police necessarily makes them defective institutions because they are not democratically organized.", "a": false, "e": "Hierarchy does not make such institutions defective; their functions may require organizational models other than democratic representation."}, {"t": "tf", "q": "Communist interpretations of democracy historically emphasized economic and social equality, while capitalist interpretations emphasized individual liberties and multi-party competition.", "a": true, "e": "Communist views stressed economic and social equality; capitalist views stressed individual liberties, civil rights and multi-party competition."}, {"t": "tf", "q": "Modernization theory suggests that economic development, higher education, and the growth of the middle class encourage democratization.", "a": true, "e": "Modernization theory links economic growth, rising education and a strong middle class to democratization."}, {"t": "tf", "q": "Elite theory argues that economic modernization automatically produces democracy regardless of how political power and wealth are distributed.", "a": false, "e": "Elite theory stresses the distribution of power and wealth: elites who control both may block democratization despite economic growth."}, {"t": "tf", "q": "According to elite theory, ruling elites who control both political authority and economic resources may resist democratization to protect their interests.", "a": true, "e": "Elites holding both political authority and economic resources may resist democracy because it threatens their interests."}, {"t": "tf", "q": "Civil society organizations can contribute to democratization only when their original purpose is explicitly political.", "a": false, "e": "Civil society organizations need not be political in purpose; they still train citizens in participation, debate and accountability."}, {"t": "tf", "q": "International trade, foreign investment, and globalization may encourage democratization by introducing new political ideas and creating pressures for reform.", "a": true, "e": "Trade, investment and globalization can spread new political ideas and create pressure for reform."}, {"t": "tf", "q": "Membership in international organizations such as the European Union is always granted without requiring countries to meet democratic standards.", "a": false, "e": "EU membership may require countries to meet democratic standards, which is one form of international pressure for reform."}, {"t": "tf", "q": "Countries that are politically isolated or economically self-sufficient are generally more vulnerable to international pressure for democratic reform.", "a": false, "e": "Politically isolated, economically self-sufficient countries are generally more resistant, not more vulnerable, to outside pressure."}, {"t": "tf", "q": "According to the cultural explanation of democratization, democratic values develop and become institutionalized over time, influencing both society and political leaders.", "a": true, "e": "The cultural explanation holds that democratic values develop gradually and become institutionalized, shaping society and leaders."}, {"t": "mc", "q": "What is the fundamental meaning of democracy?", "o": ["Rule by the military", "Rule by the people", "Rule by wealthy individuals", "Rule by religious authorities"], "a": 1, "e": "At its core, democracy means rule by the people."}, {"t": "mc", "q": "Which of the following is NOT one of the three paths through which democratic power is exercised?", "o": ["Participation", "Competition", "Liberty", "Centralization"], "a": 3, "e": "Democratic power is exercised through participation, competition and liberty. Centralization is not one of them."}, {"t": "mc", "q": "Which of the following best describes direct democracy?", "o": ["Citizens elect representatives to make all decisions.", "Political leaders make decisions without consulting citizens.", "Citizens participate directly in voting on laws and policies.", "Political authority is inherited by ruling families."], "a": 2, "e": "In direct democracy, citizens themselves vote on laws and policies rather than delegating to representatives."}, {"t": "mc", "q": "What is the primary challenge facing direct democracy in large modern nations?", "o": ["The absence of political parties", "The size factor and logistical difficulties", "The lack of constitutional laws", "The inability to establish any form of elections"], "a": 1, "e": "The size of modern nations makes it logistically difficult for every citizen to vote on every issue."}, {"t": "mc", "q": "Which statement correctly identifies a potential weakness of representative democracy?", "o": ["Citizens are required to vote directly on every single law and policy.", "It can only function in small, closely knit communities.", "Representatives may not always serve their constituents' interests.", "It prevents citizens from electing their political leaders."], "a": 2, "e": "A risk of representative democracy is that elected representatives may not always act in the best interests of those they represent."}, {"t": "mc", "q": "Why are institutions such as universities, the military, and police not necessarily defective despite their hierarchical structures?", "o": ["They are completely independent of any government authority.", "Their functions may require non-democratic organizational models.", "They have no need for rules, oversight, or any form of accountability.", "They always operate through direct democracy internally."], "a": 1, "e": "Such institutions are not defective simply because they are hierarchical; their functions may call for models other than democratic representation."}, {"t": "mc", "q": "Which feature is most strongly associated with the capitalist interpretation of democracy?", "o": ["Collective economic equality as the primary criterion", "Government ownership of all economic resources and major industries", "Individual liberties, civil rights, and multi-party competition", "The elimination of political competition"], "a": 2, "e": "The capitalist interpretation emphasizes individual liberties, civil rights and competition between multiple parties."}, {"t": "mc", "q": "According to modernization theory, which combination of factors is most likely to encourage democratization?", "o": ["Economic isolation, low education, and weak institutions", "Increased education, economic growth, and a strong middle class", "Concentration of wealth and suppression of civil society", "Political isolation and economic dependence on natural resources"], "a": 1, "e": "Modernization theory ties democratization to rising education, economic growth and an expanding middle class."}, {"t": "mc", "q": "Why does elite theory challenge modernization theory?", "o": ["It argues that education has no relationship at all with politics.", "It claims that democracy can exist only in poor societies.", "It explains why some developed countries remain undemocratic.", "It rejects the importance of political elites in democratization."], "a": 2, "e": "Elite theory accounts for economically developed countries that stay undemocratic, something modernization theory alone cannot explain."}, {"t": "mc", "q": "A country experiences rapid economic growth, but its ruling elite controls most national wealth and political authority. According to elite theory, what is the most likely outcome?", "o": ["Democratization will occur automatically as the economy grows.", "The ruling elite will necessarily distribute its wealth to citizens.", "The elite may resist democratization to protect its interests.", "Economic growth will by itself eliminate political inequality."], "a": 2, "e": "When an elite controls both wealth and power, democratization threatens its interests, so it may resist reform despite growth."}, {"t": "mc", "q": "Why are civil society organizations described as \"training grounds for democracy\"?", "o": ["They take over and replace the role of elected governments.", "They teach participation, debate, and collective decision-making.", "They prevent ordinary citizens from participating in politics.", "They operate exclusively under direct government control."], "a": 1, "e": "Civil society groups teach citizens participation, debate, collective decision-making and accountability."}, {"t": "mc", "q": "Which of the following best illustrates international pressure encouraging democratization?", "o": ["A government refuses all forms of international cooperation.", "A country becomes fully economically self-sufficient.", "Membership in a regional bloc requires democratic reform.", "A ruling elite concentrates the nation's economic resources."], "a": 2, "e": "Making membership conditional on democratic reform is a clear example of international pressure for democratization."}, {"t": "mc", "q": "Which type of country is generally more resistant to external pressure for political change?", "o": ["A country highly dependent on foreign aid", "A country deeply integrated into international trade and investment", "A country seeking membership in international organizations", "A politically isolated and economically self-sufficient country"], "a": 3, "e": "A country that is politically isolated and economically self-sufficient has little to lose from outside pressure, so it resists more easily."}, {"t": "mc", "q": "Which statement best distinguishes the role of the International Monetary Fund (IMF) from that of the European Union (EU)?", "o": ["The IMF focuses on democratic elections, while the EU focuses exclusively on military cooperation.", "The IMF may attach economic and social reform conditions to loans, while EU membership may require democratic standards.", "Both organizations demand identical political and economic reforms from every country, regardless of circumstances.", "Neither organization can influence domestic policies."], "a": 1, "e": "The IMF can attach economic and social reform conditions to its loans, while joining the EU may require meeting democratic standards."}, {"t": "mc", "q": "A country has experienced economic development and established democratic institutions, but democratic values have not become widely accepted within society. According to the cultural explanation, which conclusion is most appropriate?", "o": ["Economic development alone guarantees the success of democracy.", "Democratic institutions are sufficient regardless of cultural attitudes.", "Success also depends on democratic values gradually taking root.", "Political culture has no influence at all on democratic transitions."], "a": 2, "e": "The cultural explanation holds that democracy succeeds only when democratic values gradually develop and become institutionalized in society."}];
(function(){
 var $=function(id){return document.getElementById(id)};
 var order=[],idx=0,score=0,answered=false,tally={tf:[0,0],mc:[0,0]},cur=null;
 var nTF=QUESTIONS.filter(function(q){return q.t==="tf"}).length;
 $("sTotal").textContent=QUESTIONS.length;$("sTF").textContent=nTF;$("sMC").textContent=QUESTIONS.length-nTF;$("qTot").textContent=QUESTIONS.length;
 function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
 function show(id){["intro","quiz","result"].forEach(function(s){$(s).classList.toggle("on",s===id)});window.scrollTo(0,0)}
 function start(){
  order=shuffle(QUESTIONS.map(function(q){
   if(q.t==="mc"){var p=shuffle([0,1,2,3]);return {t:"mc",q:q.q,e:q.e,o:p.map(function(i){return q.o[i]}),a:p.indexOf(q.a)}}
   return {t:"tf",q:q.q,e:q.e,o:["True","False"],a:q.a?0:1};
  }));
  idx=0;score=0;tally={tf:[0,0],mc:[0,0]};show("quiz");render();
 }
 function render(){
  cur=order[idx];answered=false;
  $("qNum").textContent=idx+1;$("score").textContent=score;
  $("qType").textContent=cur.t==="tf"?"True / False":"Multiple Choice";
  $("hlabel").textContent="Q"+(idx+1)+" / "+order.length;
  $("bar").style.width=(idx/order.length*100)+"%";
  $("qText").textContent=cur.q;
  var box=$("opts");box.innerHTML="";box.className="opts"+(cur.t==="tf"?" tf":"");
  cur.o.forEach(function(text,i){
   var b=document.createElement("button");b.className="opt";b.type="button";
   if(cur.t==="mc"){var s=document.createElement("span");s.className="badge";s.textContent="ABCD"[i];b.appendChild(s)}
   var t=document.createElement("span");t.textContent=text;b.appendChild(t);
   b.addEventListener("click",function(){pick(i)});box.appendChild(b);
  });
  var fb=$("fb");fb.className="fb";fb.innerHTML="";
  var nb=$("nextBtn");nb.classList.remove("show");nb.textContent=idx===order.length-1?"See final score":"Next question";
 }
 function pick(i){
  if(answered)return;answered=true;
  var ok=i===cur.a;if(ok)score++;tally[cur.t][1]++;if(ok)tally[cur.t][0]++;
  var btns=$("opts").children;
  for(var k=0;k<btns.length;k++){btns[k].disabled=true;
   if(k===cur.a)btns[k].classList.add("ok");else if(k===i)btns[k].classList.add("bad");else btns[k].classList.add("fade")}
  $("score").textContent=score;
  var fb=$("fb");fb.className="fb show "+(ok?"ok":"bad");fb.innerHTML="";
  var h=document.createElement("strong");h.textContent=ok?"Correct!":"Incorrect";fb.appendChild(h);
  if(!ok){var a=document.createElement("div");a.className="ans";a.textContent="Correct answer: "+(cur.t==="mc"?"ABCD"[cur.a]+") ":"")+cur.o[cur.a];fb.appendChild(a)}
  var e=document.createElement("div");e.textContent=cur.e;fb.appendChild(e);
  $("bar").style.width=((idx+1)/order.length*100)+"%";
  var nb=$("nextBtn");nb.classList.add("show");
 }
 function next(){if(!answered)return;if(idx<order.length-1){idx++;render();window.scrollTo({top:0,behavior:"smooth"})}else finish()}
 function finish(){
  var n=order.length,p=Math.round(score/n*100);
  $("final").textContent=score+"/"+n;$("pct").textContent=p+"% score";
  $("ring").style.setProperty("--p",p+"%");
  $("msg").textContent=p>=90?"Outstanding work!":p>=75?"Great job!":p>=60?"Good effort. Keep reviewing!":"Keep practicing. You'll get there!";
  $("chips").innerHTML="";
  [["True / False",tally.tf],["Multiple Choice",tally.mc]].forEach(function(c){var d=document.createElement("span");d.className="chip";d.innerHTML=c[0]+": <b>"+c[1][0]+"/"+c[1][1]+"</b>";$("chips").appendChild(d)});
  $("hlabel").textContent="Results";$("bar").style.width="100%";show("result");
 }
 $("startBtn").addEventListener("click",start);
 $("nextBtn").addEventListener("click",next);
 $("restartBtn").addEventListener("click",start);
 document.addEventListener("keydown",function(ev){
  if(!$("quiz").classList.contains("on"))return;
  var k=ev.key.toUpperCase();
  if(!answered){
   if(cur.t==="mc"&&"ABCD".indexOf(k)>-1&&k.length===1)pick("ABCD".indexOf(k));
   else if(cur.t==="tf"&&(k==="T"||k==="F"))pick(k==="T"?0:1);
  }else if(ev.key==="Enter"){ev.preventDefault();next()}
 });
})();
</script>
</body>
</html>
