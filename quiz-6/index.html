<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Political Quiz 6 | Center JUST</title>
<style>
:root{
  --bg:#0a1226; --bg2:#101b3a; --gold:#c9a24b; --gold-l:#e6c779; --gold-d:#8c6d2a;
  --parch:#f4ecd8; --parch2:#e9dcc0; --ink:#1b2236; --ink2:#4a5068;
  --ok:#1f4fb8; --ok-bg:#dbe6fb; --bad:#b3262e; --bad-bg:#f8dcdc;
  --serif: Georgia, "Palatino Linotype", Palatino, "Book Antiqua", "Times New Roman", serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--serif); color:var(--parch);
  background:
    radial-gradient(1200px 600px at 50% -10%, #1a2a5a 0%, transparent 60%),
    repeating-linear-gradient(45deg, rgba(201,162,75,.035) 0 2px, transparent 2px 22px),
    var(--bg);
  background-attachment:fixed;
  display:flex; justify-content:center; padding:20px 14px 40px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
#app{width:100%;max-width:760px}
.screen{display:none}
.screen.active{display:block}
.brand{text-align:center;margin-bottom:18px}
.brand img{width:130px;height:130px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.brand .name{font-size:1.5rem;letter-spacing:.14em;color:var(--gold-l);margin-top:6px;font-weight:bold}
.frame{
  background:linear-gradient(180deg,var(--parch),var(--parch2));
  color:var(--ink); border-radius:6px; padding:28px 24px;
  border:2px solid var(--gold);
  box-shadow:0 0 0 5px var(--bg), 0 0 0 7px var(--gold-d), 0 18px 40px rgba(0,0,0,.55);
}
/* intro */
.intro h1{font-size:clamp(1.9rem,6vw,2.7rem);text-align:center;color:var(--bg);line-height:1.15;margin-bottom:10px}
.rule{height:3px;width:120px;margin:14px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.intro .sub{text-align:center;color:var(--ink2);font-size:1.1rem;font-style:italic;margin-bottom:22px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.chip{background:var(--bg);color:var(--gold-l);border:1px solid var(--gold);border-radius:30px;padding:8px 16px;font-size:.98rem}
.chip b{color:#fff}
.btn{
  display:block;width:100%;font-family:var(--serif);font-size:1.15rem;font-weight:bold;
  padding:16px 20px;border-radius:6px;cursor:pointer;min-height:56px;
  border:2px solid var(--gold-d);
  background:linear-gradient(180deg,var(--gold-l),var(--gold));color:var(--bg);
  box-shadow:0 4px 0 var(--gold-d);transition:transform .12s, box-shadow .12s, filter .12s;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--ok);outline-offset:3px}
.btn.dark{background:linear-gradient(180deg,#1a2a5a,var(--bg));color:var(--gold-l);border-color:var(--gold);box-shadow:0 4px 0 #000}
/* quiz */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;color:var(--parch);font-size:1rem}
.topbar .logo-s{display:flex;align-items:center;gap:8px;color:var(--gold-l);font-weight:bold;letter-spacing:.08em}
.topbar img{width:38px;height:38px;object-fit:contain}
.stats{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:1rem}
.stats span b{color:var(--gold-l)}
.bar{height:10px;border-radius:10px;background:#050a18;border:1px solid var(--gold-d);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));transition:width .5s ease}
.qtype{display:inline-block;font-size:.85rem;background:var(--bg);color:var(--gold-l);padding:3px 12px;border-radius:20px;margin-bottom:12px}
.qtext{font-size:clamp(1.15rem,3.6vw,1.45rem);font-weight:bold;color:var(--bg);margin-bottom:20px;line-height:1.4}
.opts{display:grid;gap:12px}
.opt{
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  font-family:var(--serif);font-size:1.07rem;color:var(--ink);
  background:#fffaf0;border:2px solid #cdbb91;border-radius:8px;padding:14px 16px;min-height:58px;
  cursor:pointer;transition:transform .12s, border-color .12s, background .12s, box-shadow .12s;
}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--gold-d);box-shadow:0 3px 10px rgba(0,0,0,.15)}
.opt .let{flex:0 0 36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--gold-l);font-weight:bold;border:1px solid var(--gold)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-bg);border-color:var(--ok);color:#0f2c6b;font-weight:bold}
.opt.correct .let{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:#6e1117;font-weight:bold}
.opt.wrong .let{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.55}
.opt.shake{animation:shake .4s}
.opt.pop{animation:pop .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.03)}}
.feedback{display:none;margin-top:18px;border-radius:8px;padding:14px 16px;border-left:6px solid}
.feedback.show{display:block;animation:slide .35s ease}
.feedback.ok{background:var(--ok-bg);border-color:var(--ok);color:#0f2c6b}
.feedback.bad{background:var(--bad-bg);border-color:var(--bad);color:#6e1117}
.feedback h3{font-size:1.15rem;margin-bottom:4px}
.feedback p{color:var(--ink);font-size:1rem}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#nextBtn{display:none;margin-top:18px}
#nextBtn.show{display:block}
/* results */
.result{text-align:center}
.result .brand{margin-bottom:6px}
.result h2{font-size:1.7rem;color:var(--bg)}
.score{font-size:clamp(3rem,14vw,4.8rem);font-weight:bold;color:var(--bg);line-height:1.1;margin:8px 0}
.score small{font-size:.4em;color:var(--ink2)}
.pct{color:var(--gold-d);font-size:1.3rem;font-weight:bold}
.msg{margin:14px 0 24px;color:var(--ink2);font-size:1.1rem;font-style:italic}
.ring{width:150px;height:150px;margin:10px auto}
.ring circle{fill:none;stroke-width:12}
.ring .bgc{stroke:#d3c398}
.ring .fg{stroke:var(--ok);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.2s ease}
.ring text{font-family:var(--serif);font-size:30px;font-weight:bold;fill:var(--bg)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (max-width:480px){.frame{padding:20px 15px}.brand img{width:110px;height:110px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  e:"Communism blames private ownership of capital for inequality and exploitation."},
 {t:TF,q:"Social democracy seeks to combine private markets and individual freedoms with government policies designed to reduce economic inequality.",a:true,
  e:"Social democracy keeps markets and freedoms but uses state policy to reduce inequality."},
 {t:TF,q:"Social democracy requires the complete nationalization of the economy.",a:false,
  e:"Social democracy allows private business; it does not call for nationalizing the whole economy."},
 {t:TF,q:"Fascism views society as an organic whole and places the collective above the individual.",a:true,
  e:"Fascism treats society as one organic whole in which the collective outranks the individual."},
 {t:TF,q:"Anarchism and communism both support placing the economy under strong centralized state control.",a:false,
  e:"Anarchists reject centralized state control; they see it as replacing capitalists with an oppressive state."},
 {t:TF,q:"According to anarchism, true freedom and equality can coexist only when the coercive power of the state is removed.",a:true,
  e:"Anarchism holds that freedom and equality can coexist only without the coercive power of the state."},

 /* ---------- Multiple Choice ---------- */
 {t:MC,q:"Which political attitude occupies the extreme left of the political spectrum?",

 {t:MC,q:"A person supports free markets and individual freedom but believes political reforms should occur cautiously and slowly. This person could best be described as:",

/* ---------- helpers ---------- */
var $ = function(id){return document.getElementById(id)};
function shuffle(arr){
  var a = arr.slice(), i, j, t;
  for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function show(id){
  ["intro","quiz","end"].forEach(function(s){ $(s).classList.remove("active"); });
  $(id).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}

var order = [], idx = 0, score = 0, answered = false;
var TOTAL = QUESTIONS.length;
var nTF = QUESTIONS.filter(function(q){return q.t===TF}).length;

$("cTotal").textContent = TOTAL;
$("cTF").textContent = nTF;
$("cMC").textContent = TOTAL - nTF;
$("finalTotal").textContent = TOTAL;

function startQuiz(){
  order = shuffle(QUESTIONS);
  idx = 0; score = 0;
  $("scoreTxt").textContent = "0";
  show("quiz");
  render();
}

function render(){
  answered = false;
  var q = order[idx];
  $("progressTxt").textContent = "Question " + (idx+1) + " of " + TOTAL;
  $("barFill").style.width = (idx/TOTAL*100) + "%";
  $("qType").textContent = q.t===TF ? "True / False" : "Multiple Choice";
  $("qText").textContent = q.q;
  $("fb").className = "feedback";
  $("nextBtn").className = "btn dark";
  $("nextBtn").textContent = (idx === TOTAL-1) ? "See my score" : "Next question";

  var box = $("opts"); box.innerHTML = "";
  var items;
  if(q.t===TF){
    items = [{txt:"True",val:true},{txt:"False",val:false}];
  } else {
    var correctText = q.o[q.a];
    items = shuffle(q.o).map(function(txt){ return {txt:txt,val:(txt===correctText)}; });
  }
  var letters = ["A","B","C","D"];
  items.forEach(function(it,i){
    var b = document.createElement("button");
    b.type = "button"; b.className = "opt";
    var l = document.createElement("span"); l.className="let"; l.textContent = q.t===TF ? (it.val?"T":"F") : letters[i];
    var s = document.createElement("span"); s.textContent = it.txt;
    b.appendChild(l); b.appendChild(s);
    b.addEventListener("click", function(){ choose(b,it,items); });
    b._item = it;
    box.appendChild(b);
  });
}

function choose(btn,item,items){
  if(answered) return;
  answered = true;
  var q = order[idx];
  var isCorrect = (q.t===TF) ? (item.val === q.a) : item.val;
  var buttons = $("opts").querySelectorAll(".opt");
  buttons.forEach(function(b){
    b.disabled = true;
    var correctBtn = (q.t===TF) ? (b._item.val === q.a) : b._item.val;
    if(correctBtn) b.classList.add("correct");
    else if(b===btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  btn.classList.add(isCorrect ? "pop" : "shake");
  if(isCorrect){ score++; $("scoreTxt").textContent = score; }
  $("fb").className = "feedback show " + (isCorrect ? "ok" : "bad");
  $("fbTitle").textContent = isCorrect ? "Correct!" : "Incorrect";
  $("fbText").textContent = q.e;
  $("nextBtn").className = "btn dark show";
  $("barFill").style.width = ((idx+1)/TOTAL*100) + "%";
  setTimeout(function(){ $("nextBtn").scrollIntoView({behavior:"smooth",block:"nearest"}); }, 150);
}

function next(){
  if(!answered) return;
  idx++;
  if(idx >= TOTAL){ finish(); } else { render(); window.scrollTo({top:0,behavior:"smooth"}); }
}

function finish(){
  show("end");
  $("finalScore").textContent = score;
  var pct = Math.round(score/TOTAL*100);
  $("ringTxt").textContent = pct + "%";
  var C = 314.16;
  var fg = $("ringFg");
  fg.style.strokeDashoffset = C;
  setTimeout(function(){ fg.style.strokeDashoffset = C - (C*pct/100); }, 80);
  var m;
  if(pct===100) m = "Flawless. A perfect score.";
  else if(pct>=85) m = "Excellent work. You have a strong command of the material.";
  else if(pct>=70) m = "Well done. A little more review will make it perfect.";
  else if(pct>=50) m = "A fair start. Review the topics and try again.";
  else m = "Keep studying and try again. Practice makes mastery.";
  $("finalMsg").textContent = m;
  if(pct>=70) confetti();
}

/* confetti in gold / blue / parchment */
function confetti(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var cv = $("fx"), ctx = cv.getContext("2d");
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  var cols = ["#c9a24b","#e6c779","#1f4fb8","#f4ecd8"], ps = [], i;
  for(i=0;i<110;i++){
    ps.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*0.5,
      w:6+Math.random()*6,h:8+Math.random()*8,vy:2+Math.random()*3,vx:-1+Math.random()*2,
      r:Math.random()*6,vr:-.15+Math.random()*.3,c:cols[i%cols.length]});
  }
  var frames = 0;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    frames++;
    if(frames<260) requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

$("startBtn").addEventListener("click", startQuiz);
$("nextBtn").addEventListener("click", next);
$("restartBtn").addEventListener("click", startQuiz);
})();
</script>
