<style>
:root{
  --navy:#060E24; --navy2:#0B1838; --royal:#2454BE;
  --parch:#F3EAD3; --parch2:#E9DCBC; --ink:#1E2433; --ink2:#5B5544;
  --gold:#D6B158; --brass:#B08A3A; --gold-soft:rgba(214,177,88,.35);
  --text:#F4F7FC; --muted:#A9B6D3;
  --blue:#2F6FD6; --blue-bg:#DCE8FB; --red:#C93838; --red-bg:#F8DEDB;
  --serif:Georgia,"Times New Roman",Times,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--sans);color:var(--text);background:var(--navy);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(900px 600px at 100% 0%,rgba(36,84,190,.30),transparent 60%),
    radial-gradient(700px 500px at 0% 100%,rgba(214,177,88,.08),transparent 60%),
    radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%),
    var(--navy);}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.05;
  background-image:repeating-linear-gradient(45deg,#fff 0 1px,transparent 1px 14px);}

/* Header */
header{position:sticky;top:0;z-index:10;background:rgba(6,14,36,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--gold-soft)}
.hdr{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none}
.brand img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.brand span{font-family:var(--serif);font-size:11px;letter-spacing:.14em;color:var(--gold);white-space:nowrap}
.hdr-title{font-family:var(--serif);font-size:17px;color:var(--text);text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-label{font-size:11px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;white-space:nowrap;min-width:44px;text-align:right}
.bar{height:3px;background:rgba(214,177,88,.12)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),var(--gold));transition:width .45s ease}

main{max-width:860px;margin:0 auto;padding:28px 18px 40px}
.screen{display:none;animation:rise .45s ease both}
.screen.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Intro */
.intro{text-align:center;padding:26px 22px 34px;border:1px solid var(--gold-soft);border-radius:18px;
  background:linear-gradient(180deg,rgba(11,24,56,.85),rgba(6,14,36,.85));box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.03);position:relative;overflow:hidden}
.intro::before{content:"";position:absolute;inset:10px;border:1px solid rgba(214,177,88,.18);border-radius:12px;pointer-events:none}
.intro .logo{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 8px 22px rgba(0,0,0,.55));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.under-logo{font-family:var(--serif);font-size:20px;letter-spacing:.16em;color:var(--gold);margin-top:8px}
.intro h1{font-family:var(--serif);font-weight:normal;font-size:clamp(30px,6vw,46px);margin:18px 0 6px;color:var(--text)}
.rule{width:80px;height:2px;margin:12px auto 14px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.sub{color:var(--muted);font-size:16px;line-height:1.5;max-width:520px;margin:0 auto}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px 0 28px}
.stat{min-width:120px;padding:12px 16px;border:1px solid var(--gold-soft);border-radius:12px;background:rgba(255,255,255,.03)}
.stat b{display:block;font-family:var(--serif);font-size:28px;color:var(--gold);font-weight:normal}
.stat small{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}

.btn{font:600 16px var(--sans);letter-spacing:.04em;border:0;border-radius:999px;cursor:pointer;padding:15px 34px;min-height:52px;
  color:#1B1406;background:linear-gradient(180deg,#E6C676,var(--gold) 55%,var(--brass));box-shadow:0 6px 18px rgba(214,177,88,.28),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .15s ease,box-shadow .15s ease,filter .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(214,177,88,.38),inset 0 1px 0 rgba(255,255,255,.45)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}

/* Quiz */
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.meta .pos{font-family:var(--serif);font-size:18px;color:var(--text)}
.meta .pos em{font-style:normal;color:var(--gold)}
.score-pill{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;border:1px solid var(--gold-soft);background:rgba(255,255,255,.04);font-size:14px;color:var(--muted)}
.score-pill b{color:var(--gold);font-size:16px;transition:transform .3s}
.score-pill b.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.5)}}

.card{position:relative;background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink);border-radius:16px;padding:26px 24px 22px;
  box-shadow:0 22px 50px rgba(0,0,0,.5),inset 0 0 0 1px rgba(176,138,58,.55),inset 0 0 0 6px rgba(243,234,211,1),inset 0 0 0 7px rgba(176,138,58,.35)}
.card.swap{animation:cardin .4s ease both}
@keyframes cardin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.qtype{display:inline-block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#7A5E1E;border:1px solid rgba(176,138,58,.6);border-radius:999px;padding:4px 10px;margin-bottom:14px;background:rgba(214,177,88,.12)}
.qtext{font-family:var(--serif);font-size:clamp(19px,3.2vw,23px);line-height:1.45;margin-bottom:20px}
.opts{display:grid;gap:10px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:16px/1.4 var(--sans);color:var(--ink);cursor:pointer;
  padding:13px 14px;min-height:56px;border-radius:12px;border:1.5px solid rgba(91,85,68,.28);background:rgba(255,255,255,.55);
  transition:transform .15s,border-color .15s,background .15s,opacity .25s,box-shadow .15s}
.opt:hover:not([disabled]){border-color:var(--brass);background:#fff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(120,90,30,.15)}
.opt:focus-visible{outline:3px solid var(--royal);outline-offset:2px}
.badge{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--sans);color:#6B5320;background:rgba(214,177,88,.25);border:1px solid rgba(176,138,58,.55)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--blue);background:var(--blue-bg);box-shadow:0 0 0 3px rgba(47,111,214,.18)}
.opt.correct .badge{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-bg);animation:shake .4s}
.opt.wrong .badge{background:var(--red);border-color:var(--red);color:#fff}
.opt.dim{opacity:.45}
.opt .mark{margin-left:auto;font-weight:700;font-size:18px}
.opt.correct .mark{color:var(--blue)} .opt.wrong .mark{color:var(--red)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

.fb{display:none;margin-top:18px;padding:14px 16px;border-radius:12px;border-left:5px solid;font-size:15px;line-height:1.55;animation:rise .35s ease both}
.fb.show{display:block}
.fb.ok{background:rgba(47,111,214,.10);border-color:var(--blue)}
.fb.no{background:rgba(201,56,56,.09);border-color:var(--red)}
.fb h3{font-family:var(--serif);font-size:18px;margin-bottom:4px}
.fb.ok h3{color:var(--blue)} .fb.no h3{color:var(--red)}
.fb .ans{font-weight:600;margin-bottom:4px}
.fb p{color:#3A3A3A}
.nav{display:flex;justify-content:flex-end;margin-top:18px}
.nav .btn{display:none}
.nav .btn.show{display:inline-block;animation:rise .3s ease both}

/* Results */
.results{text-align:center;padding:30px 22px 34px;border:1px solid var(--gold-soft);border-radius:18px;background:linear-gradient(180deg,rgba(11,24,56,.9),rgba(6,14,36,.9));box-shadow:0 20px 50px rgba(0,0,0,.45)}
.results .logo{width:96px;height:96px;object-fit:contain}
.ring{--p:0;width:190px;height:190px;margin:22px auto 10px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(214,177,88,.14) 0);transition:--p 1s}
.ring>div{width:156px;height:156px;border-radius:50%;background:var(--navy);display:grid;place-items:center;align-content:center;box-shadow:inset 0 0 20px rgba(0,0,0,.6)}
.ring b{font-family:var(--serif);font-weight:normal;font-size:44px;color:var(--gold);line-height:1}
.ring small{color:var(--muted);font-size:13px;margin-top:6px}
.verdict{font-family:var(--serif);font-size:24px;margin:10px 0 4px}
.final{color:var(--muted);font-size:16px;margin-bottom:22px}
.final b{color:var(--text)}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.review{margin-top:28px;text-align:left}
.review h2{font-family:var(--serif);font-weight:normal;font-size:20px;color:var(--gold);margin-bottom:12px;text-align:center}
.ritem{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);margin-bottom:8px;font-size:14px;line-height:1.45}
.ritem .ic{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.ritem.ok .ic{background:var(--blue)} .ritem.no .ic{background:var(--red)}
.ritem .rq{color:var(--text);margin-bottom:4px}
.ritem .ra{color:var(--muted)}
.ritem .ra b{color:#9DBBF0;font-weight:600}
.ritem .ra s{color:#F0A3A3}

footer{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.12em;padding:10px 0 28px}
footer b{color:var(--gold);font-weight:normal}

.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.8}}

@media (max-width:560px){
  .hdr{padding:8px 12px}
  .brand img{width:38px;height:38px}
  .brand span{font-size:10px}
  .hdr-title{font-size:15px}
  main{padding:18px 12px 30px}
  .card{padding:20px 16px 18px}
  .opts.tf{grid-template-columns:1fr}
  .intro .logo{width:120px;height:120px}
  .stat{min-width:92px;padding:10px 10px}
  .btn{width:100%}
  .nav .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
var QUESTIONS = [{"type": "tf", "q": "Political parties participate in elections primarily to win political power and influence government policies.", "answer": true, "exp": "Parties contest elections in order to win power and use it to shape government policy."}, {"type": "tf", "q": "Interest groups primarily aim to win elections and form governments.", "answer": false, "exp": "Interest groups try to influence specific policies; they do not seek elected office or try to form governments. That is the role of political parties."}, {"type": "tf", "q": "Political parties help voters make electoral decisions by providing recognizable political labels and ideological positions.", "answer": true, "exp": "Party labels and ideological positions act as shortcuts that help voters choose between candidates."}, {"type": "tf", "q": "Outsider interest groups mainly rely on personal contacts with legislators rather than public campaigns and the media.", "answer": false, "exp": "Personal contacts and lobbying are the method of insider groups. Outsider groups rely on public campaigns and the media."}, {"type": "tf", "q": "Political parties generally seek broad public support, while interest groups focus on narrower issues and specific interests.", "answer": true, "exp": "Parties need wide electoral backing, whereas interest groups concentrate on particular issues and interests."}, {"type": "tf", "q": "Gerrymandering refers to differences in population size between electoral districts that have the same number of legislative seats.", "answer": false, "exp": "Unequal district populations with the same number of seats is a problem of unequal voting power (malapportionment), not gerrymandering."}, {"type": "tf", "q": "In a plurality electoral system, a candidate must receive more than 50% of the votes to win.", "answer": false, "exp": "Under plurality, the candidate with the largest number of votes wins, even without more than 50%. Requiring more than 50% is the majority system."}, {"type": "tf", "q": "In a majority electoral system, a second round may be necessary if no candidate receives an absolute majority in the first round.", "answer": true, "exp": "A majority system requires more than 50% of the vote, so a second round may be held when nobody reaches it in the first round."}, {"type": "tf", "q": "Under the Alternative Vote system, voters rank candidates according to their preferences.", "answer": true, "exp": "Alternative Vote ballots are preferential: voters rank candidates in order, and lower preferences are used if no one has an absolute majority."}, {"type": "tf", "q": "Proportional representation generally produces fewer political parties in the legislature than single-member district systems.", "answer": false, "exp": "Proportional representation tends to produce more parties in the legislature, which is why it is associated with coalition governments."}, {"type": "tf", "q": "In proportional representation systems, electoral thresholds can result in some votes being wasted.", "answer": true, "exp": "Votes for parties that fall below the electoral threshold do not translate into seats, so those votes are wasted."}, {"type": "tf", "q": "Single-member district systems may weaken party discipline because candidates can rely heavily on their personal popularity.", "answer": true, "exp": "When candidates win on their personal popularity, they depend less on the party, which can weaken party discipline."}, {"type": "tf", "q": "Proportional representation always guarantees a stable government controlled by a single political party.", "answer": false, "exp": "Proportional representation often produces several parties and may lead to fragile coalition governments, so it guarantees no single-party government."}, {"type": "tf", "q": "In a mixed electoral system, voters may support an individual candidate from one party while voting for a different party on the party ballot.", "answer": true, "exp": "A mixed system gives voters separate votes for (function(){
  "use strict";
  var LETTERS = ["A","B","C","D","E","F"];
  var $ = function(id){ return document.getElementById(id); };
  var deck = [], idx = 0, score = 0, answered = false, log = [];

  var nTF = QUESTIONS.filter(function(q){ return q.type === "tf"; }).length;
  $("sTotal").textContent = QUESTIONS.length;
  $("sTF").textContent = nTF;
  $("sMC").textContent = QUESTIONS.length - nTF;

  function shuffle(a){
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function build(){
    return shuffle(QUESTIONS).map(function(q){
      if (q.type === "tf") {
        return { type:"tf", q:q.q, exp:q.exp, options:["True","False"], correct: q.answer === true ? 0 : 1 };
      }
      var order = shuffle(q.options.map(function(_, i){ return i; }));
      return { type:"mc", q:q.q, exp:q.exp, options: order.map(function(i){ return q.options[i]; }), correct: order.indexOf(q.answer) };
    });
  }

  function show(id){
    ["intro","quiz","results"].forEach(function(s){ $(s).classList.toggle("on", s === id); });
    window.scrollTo(0, 0);
  }

  function start(){
    document.querySelectorAll(".confetti").forEach(function(c){ c.remove(); });
    deck = build(); idx = 0; score = 0; log = [];
    $("score").textContent = "0";
    show("quiz");
    render();
  }

  function render(){
    var q = deck[idx];
    answered = false;
    var card = $("card"); card.classList.remove("swap"); void card.offsetWidth; card.classList.add("swap");
    $("pos").innerHTML = "Question <em>" + (idx + 1) + "</em> of " + deck.length;
    $("hdrLabel").textContent = "Q" + (idx + 1) + " / " + deck.length;
    $("bar").style.width = (idx / deck.length * 100) + "%";
    $("qtype").textContent = q.type === "tf" ? "True or False" : "Multiple Choice";
    $("qtext").textContent = q.q;
    var box = $("opts"); box.innerHTML = ""; box.className = "opts" + (q.type === "tf" ? " tf" : "");
    q.options.forEach(function(text, i){
      var b = document.createElement("button");
      b.type = "button"; b.className = "opt"; b.dataset.i = i;
      var badge = document.createElement("span"); badge.className = "badge";
      badge.textContent = q.type === "tf" ? (i === 0 ? "T" : "F") : LETTERS[i];
      var t = document.createElement("span"); t.textContent = text;
      var m = document.createElement("span"); m.className = "mark";
      b.appendChild(badge); b.appendChild(t); b.appendChild(m);
      b.addEventListener("click", function(){ choose(i); });
      box.appendChild(b);
    });
    var fb = $("fb"); fb.className = "fb"; fb.innerHTML = "";
    var nb = $("nextBtn"); nb.classList.remove("show");
    nb.textContent = idx === deck.length - 1 ? "See my result" : "Next question";
  }

  function choose(i){
    if (answered) return;
    answered = true;
    var q = deck[idx], ok = i === q.correct;
    var btns = $("opts").querySelectorAll(".opt");
    btns.forEach(function(b, k){
      b.disabled = true;
      if (k === q.correct) { b.classList.add("correct"); b.querySelector(".mark").textContent = "✓"; }
      else if (k === i) { b.classList.add("wrong"); b.querySelector(".mark").textContent = "✗"; }
      else b.classList.add("dim");
    });
    if (ok) { score++; var s = $("score"); s.textContent = score; s.classList.remove("pop"); void s.offsetWidth; s.classList.add("pop"); }
    log.push({ q:q.q, ok:ok, chosen:q.options[i], right:q.options[q.correct] });
    var label = q.type === "tf" ? q.options[q.correct] : LETTERS[q.correct] + ") " + q.options[q.correct];
    var fb = $("fb");
    fb.className = "fb show " + (ok ? "ok" : "no");
    fb.innerHTML = "";
    var h = document.createElement("h3"); h.textContent = ok ? "Correct!" : "Not quite";
    fb.appendChild(h);
    if (!ok) { var a = document.createElement("div"); a.className = "ans"; a.textContent = "Correct answer: " + label; fb.appendChild(a); }
    var p = document.createElement("p"); p.textContent = q.exp; fb.appendChild(p);
    $("bar").style.width = ((idx + 1) / deck.length * 100) + "%";
    var nb = $("nextBtn"); nb.classList.add("show"); nb.focus({ preventScroll:true });
    setTimeout(function(){ nb.scrollIntoView({ behavior:"smooth", block:"nearest" }); }, 120);
  }

  function next(){
    if (!answered) return;
    if (idx < deck.length - 1) { idx++; render(); } else finish();
  }

  function finish(){
    var total = deck.length, pct = Math.round(score / total * 100);
    show("results");
    $("hdrLabel").textContent = "Result";
    $("bar").style.width = "100%";
    $("rScore").textContent = score + "/" + total;
    $("rPct").textContent = pct + "%";
    var ring = $("ring"), p = 0;
    ring.style.setProperty("--p", 0);
    var timer = setInterval(function(){ p += 2; if (p >= pct) { p = pct; clearInterval(timer); } ring.style.setProperty("--p", p); }, 16);
    $("verdict").textContent = pct >= 90 ? "Outstanding!" : pct >= 75 ? "Excellent work!" : pct >= 60 ? "Good effort!" : "Keep practising!";
    $("final").innerHTML = "You answered <b>" + score + "</b> of <b>" + total + "</b> questions correctly.";
    var rv = $("review"); rv.innerHTML = "";
    log.forEach(function(r, n){
      var d = document.createElement("div"); d.className = "ritem " + (r.ok ? "ok" : "no");
      var ic = document.createElement("div"); ic.className = "ic"; ic.textContent = r.ok ? "✓" : "✗";
      var body = document.createElement("div");
      var rq = document.createElement("div"); rq.className = "rq"; rq.textContent = (n + 1) + ". " + r.q;
      var ra = document.createElement("div"); ra.className = "ra";
      if (r.ok) { ra.appendChild(document.createTextNode("Your answer: ")); var b = document.createElement("b"); b.textContent = r.right; ra.appendChild(b); }
      else {
        ra.appendChild(document.createTextNode("Your answer: ")); var s = document.createElement("s"); s.textContent = r.chosen; ra.appendChild(s);
        ra.appendChild(document.createTextNode(" · Correct: ")); var b2 = document.createElement("b"); b2.textContent = r.right; ra.appendChild(b2);
      }
      body.appendChild(rq); body.appendChild(ra); d.appendChild(ic); d.appendChild(body); rv.appendChild(d);
    });
    if (pct >= 60) confetti();
  }

  function confetti(){
    var colors = ["#D6B158","#E6C676","#2F6FD6","#F4F7FC","#B08A3A"];
    for (var i = 0; i < 70; i++) {
      var c = document.createElement("i"); c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (2.2 + Math.random() * 2) + "s";
      c.style.animationDelay = (Math.random() * .6) + "s";
      document.body.appendChild(c);
      (function(el){ setTimeout(function(){ el.remove(); }, 5200); })(c);
    }
  }

  $("startBtn").addEventListener("click", start);
  $("nextBtn").addEventListener("click", next);
  $("restartBtn").addEventListener("click", start);
  document.addEventListener("keydown", function(e){
    if (!$("quiz").classList.contains("on")) return;
    var k = e.key.toUpperCase(), q = deck[idx];
    if (!answered) {
      var i = q.type === "tf" ? (k === "T" ? 0 : k === "F" ? 1 : -1) : LETTERS.indexOf(k);
      if (i >= 0 && i < q.options.length) { e.preventDefault(); choose(i); }
    } else if (e.key === "Enter") { e.preventDefault(); next(); }
  });
})();
</script>
