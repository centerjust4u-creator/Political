<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Political Quiz 2 | Center JUST</title>
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:Georgia,'Times New Roman',serif;color:#efe6cf;background:radial-gradient(ellipse at 50% 0,#14264d 0,transparent 60%),#070d1c;padding:18px;display:flex;justify-content:center;align-items:flex-start}
.wrap{width:100%;max-width:720px}
.brand{text-align:center;color:#d4af5a;margin-bottom:14px}
.brand img{width:110px;height:110px;display:block;margin:0 auto 4px;filter:drop-shadow(0 4px 14px #000)}
.brand b{font-size:1.5rem;letter-spacing:1px}
.card{background:linear-gradient(160deg,#101a33,#0b1326);border:2px solid #b8923f;border-radius:12px;padding:26px;box-shadow:0 14px 40px #000c,inset 0 0 0 5px #0b1326,inset 0 0 0 6px #b8923f55;animation:pop .4s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
h1{font-size:2.2rem;text-align:center;color:#e3c273;margin-bottom:8px;letter-spacing:1px;text-shadow:0 2px 8px #000}
.sub{text-align:center;font-size:1.1rem;margin-bottom:18px;color:#c9bfa5;font-style:italic}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.chip{padding:7px 14px;border-radius:6px;color:#e3c273;font-weight:bold;font-size:.95rem;border:1px solid #b8923f;background:#16223f}
.btn{display:block;width:100%;border:0;cursor:pointer;font:bold 1.2rem Georgia,serif;padding:16px;border-radius:8px;color:#0b1326;background:linear-gradient(180deg,#e8c97a,#b8923f);box-shadow:0 5px 0 #6b5220;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #6b5220}
.btn.gold{background:linear-gradient(180deg,#e8c97a,#b8923f)}
.hide{display:none}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:bold;margin-bottom:8px;gap:8px;flex-wrap:wrap;color:#d4af5a}
.score{background:#16223f;border:1px solid #b8923f;color:#e3c273;padding:5px 12px;border-radius:6px}
.bar{height:8px;background:#1c2a4a;border-radius:99px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6a26,#e3c273);transition:width .4s}
.tag{display:inline-block;color:#0b1326;font-size:.8rem;padding:3px 10px;border-radius:4px;margin-bottom:10px;background:#c9a24a;font-weight:bold}
.tag.tf{background:#9fb4d8}
.q{font-size:1.35rem;line-height:1.45;margin-bottom:18px;color:#f6eed8}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:1.05rem Georgia,serif;padding:13px 14px;margin-bottom:10px;border:1px solid #6f5a2c;border-radius:8px;background:#121d38;cursor:pointer;color:#efe6cf;min-height:54px;transition:transform .1s,background .2s,border-color .2s}
.opt:hover:not(:disabled){transform:translateX(4px);background:#1a2850;border-color:#e3c273}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#e3c273;font-weight:bold;border:1px solid #b8923f;background:#0b1326}
.opt:disabled{cursor:default}
.opt.right{background:#1f4fd8;border-color:#7da2ff;color:#fff;animation:pulse .5s}
.opt.wrong{background:#b3262e;border-color:#ff7b82;color:#fff;animation:shake .4s}
.opt.right .l,.opt.wrong .l{background:#fff2;color:#fff;border-color:#fff8}
@keyframes pulse{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin:6px 0 16px;padding:14px;border-radius:8px;line-height:1.5;border-left:5px solid}
.fb.ok{background:#12285c;border-color:#4f82ff;color:#d6e3ff}
.fb.no{background:#3a1218;border-color:#e0464f;color:#ffd9dc}
.big{font-size:4rem;text-align:center;font-weight:bold;color:#e3c273;text-shadow:0 2px 10px #000}
.msg{text-align:center;font-size:1.2rem;margin:6px 0 20px;color:#c9bfa5}
.rl{display:block;margin:0 auto 8px;width:90px}
@media(max-width:480px){h1{font-size:1.7rem}.q{font-size:1.2rem}.card{padding:18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
var Q=[
{q:"The state is the organization that holds a monopoly of legitimate violence over a specific territory.",a:true,e:"A state is defined as the organization that maintains a monopoly of violence over a specific territory."},
{q:"In federal systems such as the United States, the word \"state\" can refer to a local authority like New York.",a:true,e:"In federal systems the word can mean a local authority, but in political analysis it refers to a country."},
{q:"An entity can be considered a state even if it has no sovereignty at all.",a:false,e:"To be a state, an entity must have sovereignty, which is one of its most important elements."},
{q:"External sovereignty is breached when another country can violate a state's borders or impose its will.",a:true,e:"External sovereignty means making decisions without another country dictating your actions."},
{q:"A state under occupation has diminished sovereignty, yet the state generally continues to exist as an entity.",a:true,e:"States tend to remain as entities even when occupied; they resist in order to exist."},
{q:"Governments are the most stable and most institutionalized component of the political system.",a:false,e:"Governments are the least institutionalized and most easily changed component."},
{q:"Regimes usually change easily through routine procedures.",a:false,e:"Regimes usually transform only through dramatic events such as a revolution or national crisis."},
{q:"Legitimacy creates power based on consent rather than mere coercion or violence.",a:true,e:"When citizens feel the rule is rightful, authority rests on their consent instead of force alone."},
{q:"\"Country\" is a looser, more general term than \"state\".",a:true,e:"Country can refer to the state, government, regime, or all of them together with the population and geography."},
{q:"Leaders and policies may come and go, but the state remains, even in the face of crisis or revolution.",a:true,e:"The state is the most stable and strongly institutionalized political entity."},
{q:"A nondemocratic regime limits public participation in favor of those in power.",a:true,e:"Nondemocratic regimes feature less public participation than democratic ones."},
{q:"The rules and norms that distinguish one regime from another are always written down in a constitution.",a:false,e:"Some differences appear in constitutions, but often the key rules and norms are unwritten and implicit."},
{q:"Most revolutions are directed against the prevailing regime rather than against the state itself.",a:true,e:"Revolutions aim to dismantle existing rules and norms and replace them with new ones."},
{q:"All states are equally powerful, effective, and stable.",a:false,e:"Some states are strong and effective while others are weak and disorganized; one state can even be strong in one area and ineffectual in another."},
{q:"Which three elements make up a state?",o:["Population, territory, and authority","Army, police, and courts","Constitution, parliament, and president","Government, regime, and leader"],a:0,e:"A state is comprised of a population, territory, and authority."},

{q:"Which is an example of a regime that becomes synonymous with a single leader?",o:["The Assad regime","A parliamentary cabinet","A local council","A federal court"],a:0,e:"Where one individual dominates politics, the regime becomes synonymous with the leader, as in the Assad or Mubarak regimes."},

var $=function(i){return document.getElementById(i)};

$("nAll").textContent=Q.length+" Questions";$("nTF").textContent=tfN+" True / False";$("nMC").textContent=(Q.length-tfN)+" Multiple Choice";
var order,idx,score,done;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){["intro","game","end"].forEach(function(x){$(x).classList.toggle("hide",x!==id)})}
function begin(){order=shuffle(Q);idx=0;score=0;show("game");load()}
function load(){
 var it=order[idx],isTF=typeof it.a==="boolean";done=false;
 $("prog").textContent="Question "+(idx+1)+" of "+order.length;
 $("sc").textContent="Correct: "+score;
 $("barfill").style.width=(idx/order.length*100)+"%";
 $("tag").textContent=isTF?"True / False":"Multiple Choice";$("tag").className="tag"+(isTF?" tf":"");
 $("qt").textContent=it.q;

 var list=isTF?[{t:"True",c:it.a===true},{t:"False",c:it.a===false}]:shuffle(it.o.map(function(t,i){return{t:t,c:i===it.a}}));
 list.forEach(function(o,i){
  var b=document.createElement("button");b.className="opt"+(isTF?" tfo":"");b.type="button";
  var l=document.createElement("span");l.className="l";l.textContent=isTF?(i?"✗":"✓"):"ABCD".charAt(i);
  var s=document.createElement("span");s.textContent=o.t;
  b.appendChild(l);b.appendChild(s);b.dataset.c=o.c?"1":"0";
  b.onclick=function(){pick(b,o.c,it)};box.appendChild(b)});

 $("next").textContent=idx===order.length-1?"See my score":"Next question";
}
function pick(b,ok,it){
 if(done)return;done=true;
 if(ok)score++;
 Array.prototype.forEach.call($("opts").children,function(x){x.disabled=true;if(x.dataset.c==="1")x.classList.add("right")});
 if(!ok)b.classList.add("wrong");

 var f=$("fb");f.className="fb "+(ok?"ok":"no");

function finish(){
 show("end");$("fs").textContent=score+" / "+order.length;
 var p=score/order.length;
