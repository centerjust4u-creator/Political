<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Political Quiz 1 | Center JUST</title>
<style>
:root{--navy:#0a1330;--navy2:#14224f;--gold:#d9a93a;--gold2:#f5d77a;--parch:#fbf4e1;--ink:#1c2340;--blue:#1e6fe0;--red:#e03a3a;--pink:#ff5fa2;--teal:#17c3b2;--purple:#8a5cf6;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Trebuchet MS","Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh;color:var(--ink);
background:radial-gradient(circle at 15% 10%,#3b2a8c55,transparent 40%),radial-gradient(circle at 85% 20%,#17c3b244,transparent 40%),radial-gradient(circle at 50% 100%,#ff5fa233,transparent 45%),linear-gradient(160deg,#0a1330,#14224f);
background-attachment:fixed;display:flex;justify-content:center;padding:18px 12px 40px;overflow-x:hidden}
.wrap{width:100%;max-width:760px}
.brand{text-align:center;margin-bottom:14px}
.logo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 0 0 4px #ffffff18,0 8px 28px #000a;background:#000;animation:float 3.5s ease-in-out infinite}
.brand-name{margin-top:8px;font-size:1.35rem;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,var(--gold2),var(--pink),var(--teal),var(--gold2));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes shine{to{background-position:300% 0}}
.card{background:var(--parch);border-radius:22px;padding:26px 22px;border:2px solid var(--gold);box-shadow:0 14px 40px #0009,inset 0 0 0 5px #fff6;position:relative;overflow:hidden;animation:pop .45s ease}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,var(--pink),var(--gold),var(--teal),var(--purple),var(--blue))}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.hidden{display:none!important}
h1{font-size:clamp(1.8rem,6vw,2.5rem);text-align:center;margin:8px 0 6px;background:linear-gradient(90deg,var(--purple),var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;font-size:1.05rem;color:#3a4270;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:22px}
.chip{padding:10px 16px;border-radius:999px;font-weight:800;color:#fff;font-size:.95rem;box-shadow:0 4px 10px #0003}
.c1{background:linear-gradient(135deg,var(--purple),var(--blue))}.c2{background:linear-gradient(135deg,var(--pink),#ff8a5f)}.c3{background:linear-gradient(135deg,var(--teal),#1e9be0)}
.btn{display:block;width:100%;border:none;cursor:pointer;font-size:1.15rem;font-weight:800;padding:16px;border-radius:16px;color:#fff;background:linear-gradient(135deg,var(--purple),var(--pink));box-shadow:0 8px 20px #8a5cf666;transition:transform .15s,box-shadow .15s;letter-spacing:.5px}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px #8a5cf688}.btn:active{transform:scale(.98)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#f08a24);box-shadow:0 8px 20px #d9a93a66}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-weight:800;font-size:.95rem;flex-wrap:wrap}
.pill{padding:6px 14px;border-radius:999px;color:#fff}
.p1{background:var(--purple)}.p2{background:var(--teal)}
.bar{height:12px;background:#d8cfb4;border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--gold),var(--teal));transition:width .4s}
.tag{display:inline-block;font-size:.78rem;font-weight:800;padding:4px 12px;border-radius:99px;color:#fff;margin-bottom:10px;letter-spacing:1px}
.tag.tf{background:var(--pink)}.tag.mc{background:var(--blue)}
.q{font-size:clamp(1.15rem,3.8vw,1.45rem);font-weight:800;line-height:1.4;margin-bottom:18px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;padding:12px 14px;font-size:1.05rem;font-weight:700;color:var(--ink);background:#fff;border:2px solid #e2d6ae;border-radius:14px;cursor:pointer;transition:.15s;font-family:inherit}
.opt .l{flex:0 0 36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.opt:nth-child(1) .l{background:var(--purple)}.opt:nth-child(2) .l{background:var(--pink)}.opt:nth-child(3) .l{background:var(--teal)}.opt:nth-child(4) .l{background:#f08a24}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--purple);box-shadow:0 6px 14px #8a5cf630}
.opt:disabled{cursor:default}
.opt.correct{background:linear-gradient(135deg,#2b7cf0,#1e5fc4);color:#fff;border-color:#1546a0;animation:bump .4s}
.opt.wrong{background:linear-gradient(135deg,#ee5555,#c92f2f);color:#fff;border-color:#8f1c1c;animation:shake .4s}
.opt.correct .l,.opt.wrong .l{background:#fff3;}
.opt.dim{opacity:.55}
@keyframes bump{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;font-size:1rem;line-height:1.5;animation:pop .3s}
.fb.ok{background:#dcebff;border:2px solid var(--blue);color:#0f3a82}
.fb.no{background:#ffe0e0;border:2px solid var(--red);color:#7d1717}
.fb b{display:block;font-size:1.1rem;margin-bottom:4px}
#next{margin-top:16px}
.score{font-size:clamp(3rem,14vw,5rem);font-weight:900;text-align:center;background:linear-gradient(135deg,var(--blue),var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.msg{text-align:center;font-size:1.2rem;font-weight:700;margin:8px 0 22px;color:#2b3366}
.res-logo{display:block;margin:0 auto 6px;width:90px;height:90px;border-radius:50%;border:3px solid var(--gold);background:#000}
.res-brand{text-align:center;font-weight:800;letter-spacing:2px;margin-bottom:8px;color:#8a6a10}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
@media(max-width:480px){.card{padding:22px 14px}.logo{width:92px;height:92px}}
</style>
</head>

<script>
var QUESTIONS = [
{t:"mc",q:"In its general sense, politics refers to:",o:["Interactions that aim to reconcile the conflicting interests among a group's members","The enforcement of one person's will without any resistance","The management of natural resources only","The study of historical monuments"],a:0,e:"Politics is about interactions that aim to reconcile the conflicting interests of a group's members."},
{t:"tf",q:"Wherever there is a group of people, there is inevitably some sort of politics.",a:true,e:"Any group of people inevitably has some form of politics, since interests within a group can conflict."},
{t:"mc",q:"Which of the following does NOT affect how complex the politics of a group is?",o:["The number of people in the group","The level of modernity reached by its people","The degree of knowledge of its members","The favorite sport of the group's members"],a:3,e:"Complexity depends on group size, modernity, members' knowledge, available resources, and the presence and strength of a superior authority, not on a favorite sport."},
{t:"mc",q:"The basic struggle in politics has long been the eternal battle between:",o:["Wealth and poverty","Freedom and authority","Tradition and technology","Rural and urban life"],a:1,e:"The most important concept is that politics is the eternal battle between freedom and authority."},
{t:"mc",q:"Authority is best defined as:",o:["The ability to act without fear of punishment","A power or right, usually because of rank or office, to issue commands and punish violations","A right that is established for you without your choice","A system of ideas that gives meaning to human activity"],a:1,e:"Authority is a power or right, usually due to rank or office, to issue commands and punish for violations."},
{t:"tf",q:"Greater personal freedom usually implies a smaller role for authority and more limits on its powers.",a:true,e:"The more personal freedom there is, the smaller the role of authority and the more limits on its powers."},
{t:"mc",q:"Freedom is best defined as:",o:["The right to receive an inheritance","The power to issue commands to others","The ability of an individual to act independently without fear of restriction or punishment","The competition for public power"],a:2,e:"Freedom is the ability of an individual to act independently without fear of restriction or punishment."},
{t:"tf",q:"All rights are freedoms.",a:false,e:"All freedoms are rights, but not all rights are freedoms. The sphere of rights is broader."},
{t:"mc",q:"Which of the following is a perfect example of a right that is NOT a freedom?",o:["Freedom of expression","Freedom of belief","The right of inheritance","The freedom to speak or stay silent"],a:2,e:"Heirs have an established right to inheritance regardless of their choice, so it is a right but not a freedom."},
{t:"tf",q:"Freedom implies a choice: the ability to do something or not do it.",a:true,e:"Freedom involves choice, while a right can be established for you without your choice."},
{t:"mc",q:"Why is the right of inheritance NOT considered a freedom?",o:["Because heirs hold it legally, regardless of their choice in the matter","Because it can only be exercised by the government","Because it is a form of punishment","Because it applies only to institutions"],a:0,e:"Heirs do not have the freedom to inherit; it is a right legally conferred upon them."},
{t:"mc",q:"From the perspective of political scientists, politics is defined as:",o:["The study of ancient civilizations","The struggle for power to make decisions that will affect the public as a whole","The protection of private property","The process of building physical structures"],a:1,e:"Political scientists define politics as the struggle for power to make decisions affecting the public as a whole."},
{t:"mc",q:"Power is the ability to:",o:["Avoid all rules and regulations","Own natural resources","Influence or impose one's will on others","Inherit property from relatives"],a:2,e:"Power is the ability to influence or impose one's will on others."},
{t:"tf",q:"The struggle for public power has existed as long as human beings have lived in organized communities.",a:true,e:"This struggle has existed as long as humans have lived in organized communities."},
{t:"tf",q:"For politics to exist, there must be a society with conflicting interests among its members.",a:true,e:"Without conflicting interests among members, there would be nothing to reconcile, so politics requires such a society."},
{t:"mc",q:"An institution is best described as:",o:["A temporary agreement between two people","A system so deeply embedded in people's lives as a norm or value that it is not easily displaced or changed","Any building owned by the government","A short-lived political campaign"],a:1,e:"An institution is a deeply embedded system, a norm or value, that is hard to displace or change."},
{t:"tf",q:"Institutions are nothing more than physical structures.",a:false,e:"Institutions are not mere physical structures; they include conceptual frameworks too."},
{t:"mc",q:"In this context, legitimacy means:",o:["Popular acceptance among citizens","Military strength","Ownership of land","Freedom from all laws"],a:0,e:"Institutions command and generate legitimacy, meaning popular acceptance among citizens."},
{t:"tf",q:"Once instituted, institutions are easily defeated, changed, or removed.",a:false,e:"Once instituted, institutions are both powerful and persistent, and not easily changed or removed."},
{t:"mc",q:"When institutions face threats, people often:",o:["Ignore the threat completely","Rush to defend them and even rebuild them if destroyed","Immediately abandon their values","Transfer authority to a single individual"],a:1,e:"Because institutions are deeply ingrained, people often rush to defend and even rebuild them."},
{t:"mc",q:"Which of the following are basic political institutions of a country?",o:["Fashion, sports, and music","Military, police, legislature, and judiciary","Cafes, shops, and restaurants","Newspapers, cinemas, and theaters"],a:1,e:"The basic political structures of any country include the military, police, legislature, and judiciary."},
{t:"mc",q:"Which of the following is an example of a conceptual (non-physical) institution?",o:["A courthouse building","A police station","A military barracks","Marriage"],a:3,e:"Conceptual frameworks such as marriage, religion, and slavery are institutions too."},
{t:"tf",q:"Slavery is described as a historical institution: a system of ideas that once legitimized the ownership of people.",a:true,e:"Slavery is an example of a conceptual institution that once legitimized the ownership of people."},
{t:"mc",q:"We adhere to institutions because:",o:["We are forced to by law alone","They serve our self-interest, and we also view them as legitimate means of governance","They never change","They remove all conflicts between people"],a:1,e:"We adhere to institutions not only for self-interest but also because we see them as legitimate means of governance."},

var $=function(i){return document.getElementById(i)};
var deck=[],idx=0,score=0,locked=false;

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function show(id){["intro","game","result"].forEach(function(x){$(x).classList.add("hidden")});$(id).classList.remove("hidden");}

(function chips(){
  var tf=QUESTIONS.filter(function(q){return q.t==="tf"}).length, mc=QUESTIONS.length-tf;
  $("chips").innerHTML='<span class="chip c1">'+QUESTIONS.length+' Questions</span><span class="chip c2">'+tf+' True / False</span><span class="chip c3">'+mc+' Multiple Choice</span>';
})();

function startQuiz(){deck=shuffle(QUESTIONS);idx=0;score=0;show("game");render();}
function render(){
  locked=false;var q=deck[idx];
  $("prog").textContent="Question "+(idx+1)+" of "+deck.length;
  $("sc").textContent="Correct: "+score;
  $("barfill").style.width=(idx/deck.length*100)+"%";
  var tag=$("tag");tag.textContent=q.t==="tf"?"TRUE / FALSE":"MULTIPLE CHOICE";tag.className="tag "+q.t;
  $("qtext").textContent=q.q;$("fb").innerHTML="";$("next").classList.add("hidden");
  $("next").textContent=idx===deck.length-1?"See my score":"Next question";
  var box=$("opts");box.innerHTML="";
  var items;
  if(q.t==="tf"){items=[{label:"True",val:true},{label:"False",val:false}];}
  else{items=shuffle(q.o.map(function(t,i){return {label:t,val:i===q.a};}));}
  items.forEach(function(it,i){
    var b=document.createElement("button");b.className="opt";b.type="button";
    var l=document.createElement("span");l.className="l";l.textContent=q.t==="tf"?(it.val?"T":"F"):"ABCD".charAt(i);
    var s=document.createElement("span");s.textContent=it.label;
    b.appendChild(l);b.appendChild(s);
    b.onclick=function(){answer(b,it,items);};
    b._it=it;box.appendChild(b);
  });
}
function isRight(it,q){return q.t==="tf"?it.val===q.a:it.val===true;}
function answer(btn,it,items){
  if(locked)return;locked=true;
  var q=deck[idx],ok=isRight(it,q);
  var btns=document.querySelectorAll(".opt");
  btns.forEach(function(b){b.disabled=true;if(isRight(b._it,q)&&b!==btn)b.classList.add(ok?"dim":"correct");else if(b!==btn)b.classList.add("dim");});
  btn.classList.add(ok?"correct":"wrong");
  if(ok){score++;$("sc").textContent="Correct: "+score;}
  $("fb").innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"Correct! 🎉":"Incorrect")+'</b>'+q.e+'</div>';
  $("barfill").style.width=((idx+1)/deck.length*100)+"%";
  $("next").classList.remove("hidden");
}
function next(){idx++;if(idx>=deck.length){finish();}else{render();window.scrollTo({top:0,behavior:"smooth"});}}
function finish(){
  show("result");$("final").textContent=score+" / "+deck.length;
  var p=score/deck.length,m;
  if(p===1)m="Perfect score! Outstanding! 🏆";else if(p>=.8)m="Excellent work! 🌟";else if(p>=.6)m="Good job, keep it up! 👍";else m="Keep practicing, you can do better! 💪";
  $("msg").textContent=m;window.scrollTo({top:0});
  if(p>=.6)confetti();
}
function confetti(){
  var cols=["#ff5fa2","#d9a93a","#17c3b2","#8a5cf6","#1e6fe0","#f08a24"];
  for(var i=0;i<70;i++){var d=document.createElement("div");d.className="conf";
    d.style.left=Math.random()*100+"vw";d.style.background=cols[i%cols.length];
    d.style.animationDuration=(2+Math.random()*2.5)+"s";d.style.animationDelay=(Math.random()*.8)+"s";
    document.body.appendChild(d);(function(x){setTimeout(function(){x.remove()},5500)})(d);}
}
$("start").onclick=startQuiz;$("next").onclick=next;$("restart").onclick=startQuiz;
</script>
