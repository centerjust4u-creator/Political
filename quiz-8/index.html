<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Political Quiz 8 · Center JUST</title>
<style>
:root{--navy:#060E24;--gold:#D6B158;--ink:#1d1a14;--blue:#2454BE;--red:#C93A3A;--parch:#F6EFDC;--mut:#A9B6D3}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#F4F7FC;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 90% -10%,rgba(36,84,190,.28),transparent 60%),radial-gradient(ellipse at center,#0a1534 0%,#060E24 60%,#030816 100%)}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 40px}
.serif{font-family:Georgia,"Times New Roman",serif}
.logo{display:block;margin:0 auto;width:150px;height:150px;object-fit:contain}
.brand{text-align:center;font-family:Georgia,serif;letter-spacing:.18em;color:var(--gold);font-size:1.25rem;margin:4px 0 0;text-transform:uppercase}
.hdr{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--gold);padding-bottom:10px;margin-bottom:0}
.hdr img{width:44px;height:44px;object-fit:contain}.hdr b{font-family:Georgia,serif;color:var(--gold);letter-spacing:.14em;font-size:1rem}
.hdr span{margin-left:auto;font-size:.7rem;letter-spacing:.2em;color:var(--gold)}
.bar{height:4px;background:rgba(214,177,88,.15);margin-bottom:18px}.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
.hero{text-align:center;padding-top:20px}
h1{font-family:Georgia,serif;font-size:2.3rem;margin:18px 0 8px;color:#fff;font-weight:700}
.rule{width:80px;height:2px;background:var(--gold);margin:12px auto}
.sub{color:var(--mut);font-size:1.05rem;margin:0 0 20px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.chip{border:1px solid var(--gold);border-radius:999px;padding:6px 14px;color:var(--gold);font-size:.9rem;background:rgba(214,177,88,.07)}
.btn{font-family:Georgia,serif;font-size:1.1rem;letter-spacing:.06em;background:linear-gradient(#e4c675,#c49c40);color:#1a1405;border:0;border-radius:12px;padding:15px 34px;cursor:pointer;min-height:52px;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.card{background:var(--parch);color:var(--ink);border:2px solid var(--gold);border-radius:16px;padding:22px 18px;box-shadow:0 12px 34px rgba(0,0,0,.5);animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.meta{display:flex;justify-content:space-between;font-size:.9rem;color:#6b5a2a;font-weight:600;margin-bottom:12px}
.q{font-family:Georgia,serif;font-size:1.28rem;line-height:1.45;margin:0 0 18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fffaf0;border:1.5px solid #cdb984;border-radius:12px;padding:13px 14px;margin-bottom:10px;font-size:1.02rem;color:var(--ink);cursor:pointer;min-height:54px;transition:.15s;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--gold);background:#fff3d2;transform:translateX(3px)}
.opt .l{flex:none;width:32px;height:32px;border-radius:50%;background:#1b2a55;color:var(--gold);display:grid;place-items:center;font-weight:700;font-family:Georgia,serif}
.opt:disabled{cursor:default}
.opt.ok{background:var(--blue);border-color:var(--blue);color:#fff;opacity:1}.opt.ok .l{background:#fff;color:var(--blue)}
.opt.no{background:var(--red);border-color:var(--red);color:#fff;opacity:1}.opt.no .l{background:#fff;color:var(--red)}
.opt.fade{opacity:.45}
.fb{margin-top:6px;padding:12px 14px;border-radius:12px;font-size:1rem;display:none}
.fb.show{display:block;animation:in .3s}.fb.g{background:#dce6fb;border-left:5px solid var(--blue)}.fb.b{background:#f9dcdc;border-left:5px solid var(--red)}
.nx{text-align:right;margin-top:16px;display:none}.nx.show{display:block}
.score{font-family:Georgia,serif;font-size:4.5rem;color:var(--gold);text-align:center;margin:6px 0}
.res{text-align:center}.res p{color:var(--mut);font-size:1.15rem}
footer{text-align:center;color:var(--mut);font-size:.8rem;letter-spacing:.12em;margin-top:30px}
@media(max-width:520px){h1{font-size:1.8rem}.q{font-size:1.15rem}.logo{width:120px;height:120px}}
</style></head><body><div class="wrap" id="app"></div>

oint federal judges without obtaining approval from another branch of government.", "a": false}, {"t": "mc", "q": "Which of the following represents the three branches of government in a democratic state?", "o": ["Political, Economic, and Social", "Executive, Legislative, and Judicial", "Federal, Regional, and Local", "Administrative, Military, and Religious"], "a": 1}, {"t": "mc", "q": "Who is typically responsible for the day-to-day administration of the state?", "o": ["The Head of State", "The Chief Justice", "The Prime Minister", "The Speaker of Parliament"], "a": 2}, {"t": "mc", "q": "Which of the following is a primary function of the legislative branch?", "o": ["Commanding the armed forces", "Interpreting constitutional provisions", "Appointing all government officials", "Debating, drafting, and passing laws"], "a": 3}, {"t": "mc", "q": "What distinguishes a bicameral legislature from a unicameral legislature?", "o": ["It has two separate legislative chambers.", "It gives all legislative powers to the President.", "It consists entirely of appointed judges.", "It prevents parliamentary oversight."], "a": 0}, {"t": "mc", "q": "What was the main change to Egypt's legislative structure following the 2019 constitutional amendments?", "o": ["The House of Representatives was abolished.", "The judiciary became responsible for legislation.", "The Senate was added as a second chamber.", "Parliament was replaced by a presidential council."], "a": 2}, {"t": "mc", "q": "Which statement best reflects the principle of the Rule of Law?", "o": ["Government officials may act without legal restrictions.", "All individuals and institutions are subject to the law.", "Political leaders have authority above the constitution.", "Courts must follow the personal decisions of the executive."], "a": 1}, {"t": "mc", "q": "What is the primary purpose of constitutional review?", "o": ["To supervise political campaigns", "To approve government spending", "To select members of parliament", " function sh(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}

function begin(){list=sh(Q).map(function(x){if(x.t==="mc"){var idx=sh([0,1,2,3]);return {t:"mc",q:x.q,o:idx.map(function(k){return x.o[k]}),a:idx.indexOf(x.a)}}return x});i=0;score=0;show()}

var h=hdr(TITLE.toUpperCase())+'<div class="card"><div class="meta"><span>Question '+(i+1)+' of '+list.length+'</span><span id="sc">'+score+' correct</span></div><p class="q">'+esc(x.q)+'</p>';

h+='<div class="fb" id="fb"></div><div class="nx" id="nx"><button class="btn" id="nb">'+(i===list.length-1?"See result":"Next question")+'</button></div></div><footer>CENTER JUST</footer>';
app.innerHTML=h;document.getElementById("pb").style.width=(i/list.length*100)+"%";
var bs=app.querySelectorAll(".opt");
bs.forEach(function(b){b.onclick=function(){pick(+b.dataset.k,bs,x)}});
document.getElementById("nb").onclick=function(){i++;i<list.length?show():finish()}}
function pick(k,bs,x){if(locked)return;locked=true;
var c=x.t==="tf"?(x.a?0:1):x.a;var good=k===c;if(good)score++;
bs.forEach(function(b,n){b.disabled=true;if(n===c)b.classList.add("ok");else if(n===k)b.classList.add("no");else b.classList.add("fade")});
var f=document.getElementById("fb");f.className="fb show "+(good?"g":"b");
f.innerHTML=good?"<b>Correct!</b>":"<b>Incorrect.</b> The correct answer is: "+esc(bs[c].children[1].textContent);
document.getElementById("sc").textContent=score+" correct";document.getElementById("nx").classList.add("show")}
function finish(){var p=Math.round(score/list.length*100);

document.getElementById("pb").style.width="100%";document.getElementById("rs").onclick=begin}

start();
