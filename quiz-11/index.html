<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Political Quiz 11 | Center JUST</title>
<style>
:root{--navy:#060E24;--blue:#2454BE;--gold:#D6B158;--txt:#F4F7FC;--mut:#A9B6D3;--green:#3FA66B;--red:#DE4040}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--navy);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 100% 0%,rgba(36,84,190,.38),transparent 55%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%),var(--navy)}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid rgba(214,177,88,.55)}
header img{width:44px;height:auto;display:block}
.brand b{font-family:Georgia,serif;font-size:1.15rem;letter-spacing:.06em;display:block;line-height:1.1}
.brand small{color:var(--mut);font-size:.72rem;letter-spacing:.08em}
.hl{margin-left:auto;color:var(--gold);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.bar{height:3px;background:rgba(214,177,88,.18)}.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:24px 16px}
.panel{background:rgba(14,26,62,.62);border:1px solid rgba(214,177,88,.45);border-radius:16px;padding:26px;box-shadow:0 10px 36px rgba(0,0,0,.4);backdrop-filter:blur(6px)}
.center{text-align:center}
.big{width:150px;height:auto;margin:0 auto 6px;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.wm{font-family:Georgia,serif;color:var(--gold);letter-spacing:.14em;font-size:1.1rem;margin-bottom:14px}
.pres{color:var(--mut);letter-spacing:.3em;font-size:.72rem}
h1{font-family:Georgia,serif;font-weight:700;font-size:2.1rem;margin:6px 0 10px;line-height:1.2}
.line{width:70px;height:2px;background:var(--gold);margin:12px auto}
.sub{color:var(--mut);max-width:460px;margin:0 auto 18px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.chip{border:1px solid rgba(214,177,88,.5);border-radius:999px;padding:6px 14px;font-size:.85rem;color:var(--txt);background:rgba(214,177,88,.08)}
.chip b{color:var(--gold)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{background:var(--gold);color:#1a1405;border:0;border-radius:12px;padding:14px 30px;font-weight:700;font-size:1.05rem;letter-spacing:.04em;min-height:48px;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:14px}
.meta b{color:var(--gold)}
.q{font-family:Georgia,serif;font-size:1.3rem;line-height:1.4;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(214,177,88,.35);border-radius:12px;padding:13px 14px;min-height:54px;transition:all .18s}
.opt:hover:not(:disabled){background:rgba(214,177,88,.12);border-color:var(--gold);transform:translateX(3px)}
.opt:disabled{cursor:default}
.badge{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt.ok{background:rgba(63,166,107,.22);border-color:var(--green)}.opt.ok .badge{background:var(--green);border-color:var(--green);color:#fff}
.opt.no{background:rgba(222,64,64,.22);border-color:var(--red)}.opt.no .badge{background:var(--red);border-color:var(--red);color:#fff}
.opt.fade{opacity:.45}
.fb{margin-top:16px;border-radius:12px;padding:12px 14px;border:1px solid;animation:pop .25s}
.fb.ok{border-color:var(--green);background:rgba(63,166,107,.14)}.fb.no{border-color:var(--red);background:rgba(222,64,64,.14)}
.fb b.ok{color:var(--green)}.fb b.no{color:var(--red)}
.nx{display:flex;justify-content:flex-end;margin-top:16px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pct{font-family:Georgia,serif;font-size:4.2rem;color:var(--gold);line-height:1}
.msg{color:var(--mut);margin:6px 0 18px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
h2{font-family:Georgia,serif;color:var(--gold);font-size:1.25rem;margin:26px 0 12px}
.rv{border:1px solid rgba(214,177,88,.3);border-radius:12px;padding:14px;margin-bottom:10px;background:rgba(255,255,255,.03)}
.rv p{font-family:Georgia,serif;margin-bottom:8px}
.rv div{font-size:.93rem;padding:3px 0}
.rv .w{color:#ff8a8a}.rv .c{color:#7fdca4}
.rv span{color:var(--mut)}
.perfect{border:1px solid var(--green);border-radius:12px;padding:14px;background:rgba(63,166,107,.14);margin-top:18px}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:16px;border-top:1px solid rgba(214,177,88,.35);font-family:Georgia,serif;letter-spacing:.04em}
footer b{color:var(--gold)}
@media(max-width:600px){.brand small{display:none}h1{font-size:1.6rem}.panel{padding:18px}.q{font-size:1.15rem}.hl{letter-spacing:.12em;font-size:.65rem}header{padding:10px 14px}.pct{font-size:3.4rem}}
</style></head><body>

<script>
var DATA=[{"t": "tf", "q": "Fair representation requires citizens to have an equal opportunity to influence electoral outcomes.", "a": true}, {"t": "tf", "q": "Districting refers to redrawing existing electoral boundaries after a national census.", "a": false}, {"t": "tf", "q": "Gerrymandering aims to give an unfair electoral advantage to a particular political party or group.", "a": true}, {"t": "tf", "q": "If two districts elect one representative each, despite having significantly different numbers of voters, their citizens have equal voting power.", "a": false}, {"t": "tf", "q": "Population shifts and demographic changes may necessitate redistricting.", "a": true}, {"t": "tf", "q": "The term gerrymandering originated in 1812 during the governorship of Elbridge Gerry in Massachusetts.", "a": true}, {"t": "tf", "q": "Packing aims to increase the number of representatives elected by the targeted political group.", "a": false}, {"t": "tf", "q": "Cracking involves distributing voters across multiple districts to prevent them from forming a majority.", "a": true}, {"t": "tf", "q": "Stacking involves concentrating voters into a smaller district to create an excessive majority.", "a": false}, {"t": "tf", "q": "Independent commissions are generally less susceptible to partisan influence than legislative bodies responsible for drawing electoral districts.", "a": true}, {"t": "tf", "q": "The authority responsible for drawing electoral districts is identical in all political systems.", "a": false}, {"t": "tf", "q": "The principle of population equality is based on the democratic ideal of “one person, one vote.”", "a": true}, {"t": "tf", "q": "The principle of community of interest encourages the fragmentation of groups with common economic, cultural, or social ties.", "a": false}, {"t": "tf", "q": "Natural barriers, such as rivers and mountains, may justify exceptions to the principle of contiguity.", "a": true}, {"t": "tf", "q": "Perfect alignment with existing administrative boundaries must always be maintained, even when it conflicts with population equality.", "a": false}, {"t": "mc", "q": "Which of the following represents the two main components of fair representation?", "o": ["Political independence and geographical expansion", "Voter influence and equal power", "Population growth and political competition", "Legislative authority and judicial supervision"], "a": 1}, {"t": "mc", "q": "What is the process of dividing a geographical area into electoral districts for the first time called?", "o": ["Redistricting", "Gerrymandering", "Districting", "Stacking"], "a": 2}, {"t": "mc", "q": "What is the primary purpose of conducting periodic redistricting?", "o": ["To maintain equal representation despite population changes", "To eliminate political competition", "To increase the influence of incumbent politicians", "To reduce the number of eligible voters"], "a": 0}, {"t": "mc", "q": "The term “gerrymandering” was created by combining Elbridge Gerry’s name with the name of which animal?", "o": ["Crocodile", "Snake", "Chameleon", "Salamander"], "a": 3}, {"t": "mc", "q": "A political group has a natural majority in three neighboring districts. Electoral boundaries are manipulated to concentrate its supporters into a single district. Which technique is being used?", "o": ["Cracking", "Packing", "Stacking", "Contiguity"], "a": 1}, {"t": "mc", "q": "Which of the following best describes the objective of cracking?", "o": ["Creating an excessive majority in one district", "Preserving existing administrative boundaries", "Fragmenting a voting majority to prevent it from winning representation", "Increasing the geographical compactness of districts"], "a": 2}, {"t": "mc", "q": "A political group forms a majority in a small district. The district is expanded until the group becomes a minority. This is an example of:", "o": ["Stacking", "Packing", "Cracking", "Population equality"], "a": 0}, {"t": "mc", "q": "What is a major disadvantage of assigning districting responsibilities to legislative bodies?", "o": ["The absence of demographic information", "The inability to conduct national censuses", "The elimination of electoral districts", "The risk of politicization and manipulation by incumbents"], "a": 3}, {"t": "mc", "q": "Which of the following countries incorporates a judicial member into its Delimitation Commission?", "o": ["Egypt", "India", "United Kingdom", "United States"], "a": 1}, {"t": "mc", "q": "In 2015, the U.S. Supreme Court upheld the constitutionality of transferring redistricting authority from the Arizona State Legislature to:", "o": ["The federal government", "A political party", "An independent redistricting commission", "A national census authority"], "a": 2}, {"t": "mc", "q": "Two electoral districts elect one representative each. District A contains 1.1 million voters, while District B contains only 500 voters. Which statement is correct?", "o": ["Voters in District B have significantly greater individual voting power.", "Voters in District A have greater individual voting power.", "Both districts have equal individual voting power.", "Population differences have no effect on fair representation."], "a": 0}, {"t": "mc", "q": "Which principle seeks to prevent the fragmentation of groups sharing common social, cultural, economic, or historical ties?", "o": ["Compactness", "Population equality", "Contiguity", "Community of interest"], "a": 3}, {"t": "mc", "q": "An electoral district consists of several geographically disconnected areas without any valid justification. Which principle does this arrangement violate most directly?", "o": ["Community of interest", "Contiguity", "Population equality", "Voter influence"], "a": 1}, {"t": "mc", "q": "Which principle acts as a safeguard against creating unnecessarily irregular or bizarrely shaped electoral districts?", "o": ["Community of interest", "Equal power", "Compactness", "Judicial independence"], "a": 2}, {"t": "mc", "q": "What is the fundamental difference between legitimate redistricting and gerrymandering?", "o": ["Legitimate redistricting seeks fair representation, whereas gerrymandering seeks an unfair electoral advantage.", "Legitimate redistricting occurs only once, whereas gerrymandering occurs periodically.", "Legitimate redistricting is exclusively performed by judges.", "Gerrymandering aims to maintain population equality, whereas legitimate redistricting ignores it."], "a": 0}];

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function intro(){
 var tf=DATA.filter(function(q){return q.t==="tf"}).length,mc=DATA.length-tf;
 pb.style.width="0";hl.textContent="POLITICAL QUIZ 11";
 app.innerHTML='<div class="panel center"><img class="big" src="'+LOGO+'" alt="Center JUST"><div class="wm">Center JUST</div><div class="pres">CENTER JUST PRESENTS</div><h1>Political Quiz 11</h1><div class="line"></div><p class="sub">Welcome to Center JUST, please answer the following questions.</p><div class="chips"><span class="chip"><b>'+DATA.length+'</b> Questions</span><span class="chip"><b>'+tf+'</b> True / False</span><span class="chip"><b>'+mc+'</b> Multiple Choice</span></div><button class="btn" id="go">Start Quiz</button></div>';
 document.getElementById("go").onclick=start;
}
function start(){
 Q=shuf(DATA).map(function(q){
  if(q.t==="tf")return{t:"tf",q:q.q,o:["True","False"],a:q.a?0:1};
  var ord=shuf(q.o.map(function(_,i){return i}));
  return{t:"mc",q:q.q,o:ord.map(function(i){return q.o[i]}),a:ord.indexOf(q.a)};
 });
 idx=0;score=0;wrong=[];show();
}
function show(){
 cur=Q[idx];answered=false;
 pb.style.width=(idx/Q.length*100)+"%";hl.textContent="Q"+(idx+1)+" / "+Q.length;
 var h='<div class="panel"><div class="meta"><span>Question <b>'+(idx+1)+'</b> of '+Q.length+'</span><span><b id="sc">'+score+'</b> / '+Q.length+' correct</span></div><div class="q">'+esc(cur.q)+'</div><div class="opts">';
 cur.o.forEach(function(t,i){h+='<button class="opt" data-i="'+i+'"><span class="badge">'+L[i]+'</span><span>'+esc(t)+'</span></button>'});
 h+='</div><div id="fb"></div></div>';
 app.innerHTML=h;
 Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){pick(+b.dataset.i)}});
 window.scrollTo(0,0);
}
function pick(i){
 if(answered)return;answered=true;
 var ok=i===cur.a;if(ok)score++;else wrong.push({q:cur.q,mine:cur.o[i],right:cur.o[cur.a]});
 Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b,k){
  b.disabled=true;
  if(k===cur.a)b.classList.add("ok");else if(k===i)b.classList.add("no");else b.classList.add("fade");
 });
 document.getElementById("sc").textContent=score;
 var last=idx===Q.length-1;
 document.getElementById("fb").innerHTML=(ok?'<div class="fb ok"><b class="ok">Correct</b></div>':'<div class="fb no"><b class="no">Not quite</b> &mdash; Correct answer: ('+L[cur.a]+') '+esc(cur.o[cur.a])+'</div>')+'<div class="nx"><button class="btn" id="nx">'+(last?"See result":"Next question")+'</button></div>';
 document.getElementById("nx").onclick=next;
 document.getElementById("nx").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){idx++;if(idx>=Q.length)results();else show()}
function results(){
 var n=Q.length,p=Math.round(score/n*100);
 pb.style.width="100%";hl.textContent="RESULTS";
 var m=p>=90?"Outstanding work!":p>=70?"Well done!":p>=50?"Good effort, keep practicing.":"Keep studying and try again.";
 var h='<div class="panel center"><img class="big" style="width:90px" src="'+LOGO+'" alt="Center JUST"><div class="wm">Center JUST</div><div class="pct">'+p+'%</div><div class="line"></div><p style="font-size:1.2rem"><b>'+score+' / '+n+'</b> correct</p><p class="msg">'+m+'</p><div class="acts"><button class="btn" id="rs">Restart the Quiz</button></div></div>';
 if(wrong.length){
  h+='<h2>Questions you answered incorrectly ('+wrong.length+')</h2>';
  wrong.forEach(function(w,i){h+='<div class="rv"><p>'+(i+1)+'. '+esc(w.q)+'</p><div class="w"><span>Your answer:</span> '+esc(w.mine)+'</div><div class="c"><span>Correct answer:</span> '+esc(w.right)+'</div></div>'});
 }else h+='<div class="perfect center"><b>Perfect score!</b> You answered every question correctly.</div>';
 app.innerHTML=h;document.getElementById("rs").onclick=start;window.scrollTo(0,0);
}
document.addEventListener("keydown",function(e){
 var k=e.key.toUpperCase(),i=L.indexOf(k);
 if(e.key==="Enter"){var n=document.getElementById("nx");if(n){n.click();return}var g=document.getElementById("go");if(g){g.click();return}}
 if(i>=0&&k.length===1&&cur&&!answered&&document.querySelector(".opt")&&i<cur.o.length)pick(i);
});
intro();
</script></body></html>
