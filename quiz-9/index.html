<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Political Quiz 9 · Center JUST</title>
<style>
:root{--navy:#060E24;--royal:#2454BE;--white:#F4F7FC;--muted:#A9B6D3;--gold:#D6B158;--blue:#3B82F6;--red:#DE4040;
--serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--sans);color:var(--white);background:var(--navy);overflow-x:hidden;line-height:1.5}
body::before{content:"";position:fixed;inset:0;z-index:-1;
background:radial-gradient(circle at 88% 6%,rgba(36,84,190,.38),transparent 46%),
radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%),var(--navy)}
.wrap{max-width:780px;margin:0 auto;padding:0 18px 40px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:16px 0 12px;border-bottom:1px solid rgba(214,177,88,.45)}
.hbrand{display:flex;flex-direction:column;align-items:center;line-height:1}
header img{width:44px;height:44px;object-fit:contain}
.hname{font-family:var(--serif);font-size:.7rem;letter-spacing:.12em;color:var(--gold);margin-top:3px;white-space:nowrap}
.htitle{font-family:var(--serif);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hlabel{margin-left:auto;font-size:.72rem;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;white-space:nowrap}
.bar{height:3px;background:rgba(214,177,88,.15);border-radius:2px;margin:10px 0 26px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8923d,var(--gold));transition:width .4s}
main{flex:1}
.panel{background:rgba(14,26,58,.72);border:1px solid rgba(214,177,88,.38);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:30px 26px;backdrop-filter:blur(6px);animation:rise .45s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.center{text-align:center}
.biglogo{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 6px 22px rgba(214,177,88,.25))}
.brandname{font-family:var(--serif);color:var(--gold);letter-spacing:.22em;font-size:1rem;margin-top:6px}
h1{font-family:var(--serif);font-weight:normal;font-size:2.3rem;margin:18px 0 6px}
.rule{width:70px;height:2px;background:var(--gold);margin:14px auto 18px}
.sub{color:var(--muted);font-size:1.05rem}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px 0 28px}
.stat{border:1px solid rgba(214,177,88,.35);border-radius:12px;padding:12px 18px;min-width:120px;background:rgba(6,14,36,.5)}
.stat b{display:block;font-family:var(--serif);font-size:1.7rem;color:var(--gold);font-weight:normal}
.stat span{font-size:.78rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.btn{font:inherit;cursor:pointer;border:none;border-radius:999px;padding:14px 34px;font-weight:600;font-size:1rem;letter-spacing:.04em;transition:transform .15s,box-shadow .2s,background .2s}
.gold{background:linear-gradient(180deg,#e2c272,#c49c42);color:#1a1405;box-shadow:0 6px 20px rgba(214,177,88,.3)}
.gold:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(214,177,88,.42)}
.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:14px;gap:10px}
.tag{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(214,177,88,.45);border-radius:999px;padding:3px 10px}
.score{color:var(--gold);font-weight:600}
.qtext{font-family:var(--serif);font-size:1.38rem;line-height:1.45;margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--white);background:rgba(6,14,36,.55);border:1px solid rgba(169,182,211,.25);border-radius:12px;padding:14px 16px;min-height:56px;cursor:pointer;transition:border-color .2s,background .2s,transform .15s,opacity .3s}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(214,177,88,.08);transform:translateX(3px)}
.opt:disabled{cursor:default}
.badge{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:bold;border:1px solid var(--gold);color:var(--gold)}
.opt.ok{border-color:var(--blue);background:rgba(59,130,246,.18)}
.opt.ok .badge{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.bad{border-color:var(--red);background:rgba(222,64,64,.18);animation:shake .35s}
.opt.bad .badge{background:var(--red);border-color:var(--red);color:#fff}
.opt.fade{opacity:.45}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:18px;border-radius:12px;padding:14px 16px;border-left:4px solid;animation:rise .3s}
.fb.ok{border-color:var(--blue);background:rgba(59,130,246,.12)}
.fb.bad{border-color:var(--red);background:rgba(222,64,64,.12)}
.fb strong{display:block;margin-bottom:4px}
.fb.ok strong{color:#7fb0ff}.fb.bad strong{color:#ff8a8a}
.fb p{color:var(--white);font-size:.96rem}
.fb .ca{color:var(--muted);margin-bottom:4px}
.nextrow{display:flex;justify-content:flex-end;margin-top:20px}
.pct{font-family:var(--serif);font-size:4.2rem;color:var(--gold);line-height:1;margin:14px 0 6px}
.msg{color:var(--muted);margin-bottom:24px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
footer{text-align:center;color:var(--muted);font-size:.78rem;letter-spacing:.12em;padding-top:28px}
footer b{color:var(--gold);font-weight:normal}
.hidden{display:none}
@media(max-width:560px){
 .wrap{padding:0 12px 30px}
 .htitle{font-size:.92rem}.hlabel{font-size:.64rem;letter-spacing:.1em}
 .panel{padding:22px 16px}
 h1{font-size:1.8rem}.qtext{font-size:1.15rem}
 .biglogo{width:120px;height:120px}
 .btn{width:100%}.nextrow .btn{width:auto}
 .pct{font-size:3.4rem}
}
</style>
</head>

<script>
var QUESTIONS = [{"t": "tf", "q": "In a parliamentary system, the executive branch derives its legitimacy from the legislative branch.", "a": true, "e": "Parliamentary systems fuse executive and legislative power: the government depends on the confidence of the parliamentary majority."}, {"t": "tf", "q": "In parliamentary systems, the Head of State and the Head of Government are always the same person.", "a": false, "e": "They are separate roles: the Head of State (for example, a monarch) is distinct from the Prime Minister, who holds most executive power."}, {"t": "tf", "q": "In parliamentary systems, the Prime Minister is generally elected directly by the public.", "a": false, "e": "The Prime Minister is not directly elected; he or she stays in office by keeping the confidence of the parliamentary majority."}, {"t": "tf", "q": "A parliamentary monarchy is a system in which the Head of State is a monarch.", "a": true, "e": "In a parliamentary monarchy, such as Japan, the Head of State is a monarch while the Prime Minister leads the government."}, {"t": "tf", "q": "A vote of no confidence allows parliament to remove the Prime Minister and the cabinet from office.", "a": true, "e": "Because the government depends on parliamentary confidence, a vote of no confidence can remove the Prime Minister and the cabinet."}, {"t": "tf", "q": "A political party holding a plurality of parliamentary seats necessarily controls more than 50% of the legislature.", "a": false, "e": "A plurality means the largest share of seats, which can be below 50%; more than 50% is an absolute majority."}, {"t": "tf", "q": "Coalition governments may experience instability because of disagreements between participating political parties.", "a": true, "e": "When several parties share power, disagreements among them can weaken or break the coalition."}, {"t": "tf", "q": "In presidential systems, the President typically serves as both Head of State and Head of Government.", "a": true, "e": "In presidential systems, both roles are combined in the President."}, {"t": "tf", "q": "Presidential systems generally have a weaker separation of powers than parliamentary systems.", "a": false, "e": "The opposite is true: separation of executive and legislative powers is the defining feature of presidential systems."}, {"t": "tf", "q": "In presidential systems, the President and the legislature can belong to different political parties.", "a": true, "e": "This situation is called divided government."}, {"t": "tf", "q": "A presidential system allows parliament to remove the President through an ordinary vote of no confidence.", "a": false, "e": "Presidents serve fixed terms that cannot easily be altered; the vote of no confidence belongs to parliamentary systems."}, {"t": "tf", "q": "Divided government may cause legislative gridlock when the President and the legislature disagree on policies.", "a": true, "e": "When different parties control the presidency and the legislature, policy disagreements can stall legislation."}, {"t": "tf", "q": "In semi-presidential systems, both the President and the Prime Minister exercise executive authority.", "a": true, "e": "Semi-presidential systems combine a directly elected President and a Prime Minister who share executive authority."}, {"t": "tf", "q": "In semi-presidential systems, the Prime Minister always holds greater political power than the President.", "a": false, "e": "Executive authority is shared between the two; the Prime Minister does not always hold greater power."}, {"t": "tf", "q": "One disadvantage of semi-presidential systems is that unclear divisions of responsibility may weaken public accountability.", "a": true, "e": "When responsibility is split between two executives, it can be unclear who is accountable for decisions."}, {"t": "mc", "q": "Which of the following best describes the relationship between the executive and legislative branches in a parliamentary system?", "o": ["Complete institutional independence", "Fusion of executive and legislative power", "Executive superiority over all other branches", "Absence of legislative authority"], "a": 1, "e": "Parliamentary systems are characterised by the fusion of executive and legislative power."}, {"t": "mc", "q": "Who generally holds the majority of executive power in a parliamentary system?", "o": ["The Head of State", "The Speaker of Parliament", "The Prime Minister", "The Chief Justice"], "a": 2, "e": "The Prime Minister, as Head of Government, holds most executive power."}, {"t": "mc", "q": "Which of the following is an example of a parliamentary monarchy?", "o": ["Germany", "United States", "Japan", "France"], "a": 2, "e": "Japan has a monarch as Head of State and a Prime Minister who leads the government."}, {"t": "mc", "q": "In a parliamentary system, the Prime Minister usually remains in office as long as:", "o": ["The President approves every decision", "The Prime Minister maintains the confidence of the parliamentary majority", "The judiciary supports the government", "The Prime Minister completes a fixed seven-year term"], "a": 1, "e": "The Prime Minister's tenure depends on keeping the confidence of the parliamentary majority."}, {"t": "mc", "q": "A political party wins 42% of parliamentary seats, while all other parties receive smaller individual shares. Which statement is correct?", "o": ["The party has an absolute majority", "The party automatically controls the government", "The party has a plurality but not an absolute majority", "The party must immediately call a presidential election"], "a": 2, "e": "Having the largest share is a plurality; an absolute majority would require more than 50% of the seats."}, {"t": "mc", "q": "Which of the following is a major advantage of parliamentary systems?", "o": ["Strong institutional separation between executive and legislature", "Guaranteed fixed terms for Prime Ministers", "Greater efficiency in passing legislation", "Direct popular election of the Prime Minister"], "a": 2, "e": "Because the government controls the parliamentary majority, legislation can be passed more efficiently."}, {"t": "mc", "q": "Which feature most clearly distinguishes presidential systems from parliamentary systems?", "o": ["The existence of political parties", "The separation of executive and legislative powers", "The existence of a national constitution", "The presence of a legislature"], "a": 1, "e": "Presidential systems separate executive and legislative powers, while parliamentary systems fuse them."}, {"t": "mc", "q": "In a presidential system, cabinet members are generally:", "o": ["Selected directly by parliament", "Required to be parliamentary majority leaders", "Chosen by the President from outside the legislature", "Elected through a vote of no confidence"], "a": 2, "e": "The President chooses cabinet members, generally from outside the legislature."}, {"t": "mc", "q": "What does the term \"divided government\" mean in a presidential system?", "o": ["The President shares office with two Prime Ministers", "The President and legislature are controlled by different political parties", "The judiciary controls the executive branch", "The government is divided into regional administrations"], "a": 1, "e": "Divided government occurs when different parties control the presidency and the legislature."}, {"t": "mc", "q": "Why might the judiciary become more active in a presidential system?", "o": ["It directly appoints cabinet ministers", "It replaces the legislature during elections", "It may be required to resolve disputes between the President and legislature", "It has the authority to call votes of no confidence"], "a": 2, "e": "Conflicts between two separately elected branches may need to be settled by the courts."}, {"t": "mc", "q": "Which of the following best explains the stability associated with presidential systems?", "o": ["Presidents can be removed whenever public opinion changes", "Presidents and legislatures generally serve fixed terms that cannot easily be altered", "The executive and legislature are controlled by the same party", "Presidents must maintain parliamentary confidence"], "a": 1, "e": "Fixed terms for both the President and the legislature provide stability."}, {"t": "mc", "q": "Which combination correctly describes the executive structure of a semi-presidential system?", "o": ["An indirectly elected President and a ceremonial Prime Minister", "A directly elected President and a Prime Minister who both exercise executive authority", "A monarch and a directly elected Prime Minister", "A President who exercises no political power and a judicial cabinet"], "a": 1, "e": "Semi-presidential systems pair a directly elected President with a Prime Minister, both holding executive authority."}, {"t": "mc", "q": "In a semi-presidential system, which responsibility is commonly associated with the Prime Minister?", "o": ["Serving exclusively as commander in chief", "Managing day-to-day domestic policy and leading the cabinet", "Exercising complete control over the judiciary", "Representing the country exclusively in international relations"], "a": 1, "e": "The Prime Minister typically leads the cabinet and manages day-to-day domestic policy."}, {"t": "mc", "q": "A semi-presidential country has a directly elected President serving a fixed term, while its Prime Minister loses parliamentary confidence. What is the most likely constitutional consequence?", "o": ["Both the President and Prime Minister must automatically resign", "The President's fixed term immediately ends", "The Prime Minister may be removed while the President remains in office", "Parliament permanently assumes all executive powers"], "a": 2, "e": "The Prime Minister is accountable to parliament, but the President's fixed term is unaffected."}, {"t": "mc", "q": "Which of the following comparisons is most accurate?", "o": ["Parliamentary systems emphasize separation of powers, while presidential systems emphasize fusion of powers.", "Presidential systems allow votes of no confidence, while parliamentary systems prohibit them.", "Semi-presidential systems completely eliminate conflicts between executive officials.", "Parliamentary systems generally promote legislative efficiency, presidential systems emphasize stronger institutional checks and balances, and semi-presidential systems combine a fixed-term presidency with parliamentary accountability of the Prime Minister."], "a": 3, "e": "The other options reverse the facts: parliamentary systems fuse powers, votes of no confidence belong to parliamentary systems, and semi-presidential systems can still have executive conflict."}];

  order=shuffle(QUESTIONS).map(function(q){
   var opts;
   if(q.t==="tf"){opts=[{text:"True",ok:q.a===true},{text:"False",ok:q.a===false}]}
   else{opts=shuffle(q.o.map(function(t,i){return{text:t,ok:i===q.a}}))}
   return{q:q,opts:opts};
  });
  idx=0;correct=0;show("quiz");render();
 }
 function render(){
  cur=order[idx];answered=false;
  $("qnum").textContent="Question "+(idx+1)+" of "+order.length;
  $("qtype").textContent=cur.q.t==="tf"?"True / False":"Multiple Choice";
  $("qscore").textContent=correct+" correct";
  $("hlabel").textContent="Q"+(idx+1)+" / "+order.length;
  $("bar").style.width=(idx/order.length*100)+"%";
  $("qtext").textContent=cur.q.q;
  var box=$("opts");box.innerHTML="";
  cur.opts.forEach(function(o,i){
   var b=document.createElement("button");b.className="opt";
   var bd=document.createElement("span");bd.className="badge";bd.textContent=cur.q.t==="tf"?(o.text==="True"?"T":"F"):"ABCD"[i];
   var tx=document.createElement("span");tx.textContent=o.text;
   b.appendChild(bd);b.appendChild(tx);
   b.addEventListener("click",function(){pick(i)});box.appendChild(b);
  });
  $("fb").innerHTML="";$("nextBtn").classList.add("hidden");
  $("nextBtn").textContent=idx===order.length-1?"See final score":"Next question";
 }
 function pick(i){
  if(answered)return;answered=true;
  var btns=$("opts").children,ok=cur.opts[i].ok,ci=0;
  cur.opts.forEach(function(o,k){btns[k].disabled=true;if(o.ok){ci=k;btns[k].classList.add("ok")}else if(k===i)btns[k].classList.add("bad");else btns[k].classList.add("fade")});
  if(ok)correct++;
  $("qscore").textContent=correct+" correct";
  $("bar").style.width=((idx+1)/order.length*100)+"%";
  var fb=document.createElement("div");fb.className="fb "+(ok?"ok":"bad");
  var s=document.createElement("strong");s.textContent=ok?"Correct!":"Incorrect";fb.appendChild(s);
  if(!ok){var ca=document.createElement("p");ca.className="ca";var lab=cur.q.t==="tf"?"":"("+"ABCD"[ci]+") ";ca.textContent="Correct answer: "+lab+cur.opts[ci].text;fb.appendChild(ca)}
  var p=document.createElement("p");p.textContent=cur.q.e;fb.appendChild(p);
  $("fb").appendChild(fb);$("nextBtn").classList.remove("hidden");
 }
 function next(){if(!answered)return;idx++;if(idx<order.length)render();else finish()}
 function finish(){
  var pct=Math.round(correct/order.length*100);
  $("rPct").textContent=pct+"%";$("rScore").textContent=correct+" / "+order.length;
  $("rMsg").textContent=pct>=90?"Outstanding work!":pct>=75?"Great job!":pct>=50?"Good effort, keep practising.":"Keep studying and try again.";
  $("hlabel").textContent="Results";$("bar").style.width="100%";show("result");
 }
 $("startBtn").addEventListener("click",start);
 $("nextBtn").addEventListener("click",next);
 $("restartBtn").addEventListener("click",start);
 document.addEventListener("keydown",function(e){
  if($("quiz").classList.contains("hidden"))return;
  var k=e.key.toUpperCase();
  if(!answered){var m={A:0,B:1,C:2,D:3,T:0,F:1}[k];if(m!==undefined&&m<cur.opts.length&&(cur.q.t==="tf"?"TF".indexOf(k)>=0:"ABCD".indexOf(k)>=0))pick(m)}
  else if(e.key==="Enter")next();
 });
})();
</script>
</body>
</html>
