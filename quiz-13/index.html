<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Political Quiz 13 | Center JUST</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#060E24;--blue:#2454BE;--gold:#D6B158;--txt:#F4F7FC;--mut:#A9B6D3;--green:#3FA66B;--red:#DE4040}
html,body{min-height:100%}
body{background:var(--navy);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 600px at 100% 0%,rgba(36,84,190,.35),transparent 60%),radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.45) 100%),var(--navy)}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid rgba(214,177,88,.55)}
header img{width:44px;height:44px;object-fit:contain}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:20px;letter-spacing:.5px;line-height:1.1}
.brand small{display:block;font-size:11px;color:var(--mut);font-style:italic;letter-spacing:.5px}
.tag{margin-left:auto;font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;white-space:nowrap}
.bar{height:3px;background:rgba(214,177,88,.15)}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:24px 16px}
.panel{background:rgba(255,255,255,.05);border:1px solid rgba(214,177,88,.45);border-radius:16px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.45);backdrop-filter:blur(6px)}
h1,h2,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:normal}
.center{text-align:center}
.hero img{width:170px;height:170px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(214,177,88,.35));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.cj{font-family:Georgia,serif;font-size:22px;color:var(--gold);letter-spacing:3px;margin-top:6px}
.pres{font-size:12px;letter-spacing:4px;color:var(--mut);margin-top:18px}
h1{font-size:34px;margin:8px 0 10px;line-height:1.2}
.line{width:70px;height:2px;background:var(--gold);margin:12px auto}
.sub{color:var(--mut);margin-bottom:18px;line-height:1.5}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 22px}
.chip{border:1px solid rgba(214,177,88,.5);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--gold);background:rgba(214,177,88,.07)}
.btn{background:linear-gradient(180deg,#e3c473,var(--gold));color:#1a1405;border:0;border-radius:12px;padding:14px 30px;font-size:17px;font-weight:700;cursor:pointer;min-height:50px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(214,177,88,.3)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-bottom:14px}
.meta b{color:var(--gold)}
.qtext{font-size:22px;line-height:1.45;margin-bottom:20px;font-family:Georgia,serif}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:rgba(255,255,255,.06);color:var(--txt);border:1px solid rgba(214,177,88,.35);border-radius:12px;padding:14px;font-size:16px;line-height:1.4;cursor:pointer;min-height:56px;transition:all .2s;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(214,177,88,.1);transform:translateX(3px)}
.opt .l{flex:0 0 34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700}
.opt:disabled{cursor:default}
.opt.fade{opacity:.4}
.opt.ok{background:rgba(63,166,107,.25);border-color:var(--green);opacity:1}
.opt.ok .l{background:var(--green);border-color:var(--green);color:#fff}
.opt.bad{background:rgba(222,64,64,.25);border-color:var(--red);opacity:1;animation:shake .35s}
.opt.bad .l{background:var(--red);border-color:var(--red);color:#fff}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:18px;padding:14px 16px;border-radius:12px;border-left:4px solid;animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.fb.ok{border-color:var(--green);background:rgba(63,166,107,.15)}
.fb.bad{border-color:var(--red);background:rgba(222,64,64,.15)}
.fb b{display:block;font-size:17px;margin-bottom:2px}
.nx{display:flex;justify-content:flex-end;margin-top:16px}
.pct{font-family:Georgia,serif;font-size:76px;color:var(--gold);line-height:1}
.msg{color:var(--mut);margin:6px 0 4px;font-size:18px}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0}
h2{font-size:22px;color:var(--gold);margin:26px 0 12px}
.rv{border:1px solid rgba(222,64,64,.5);background:rgba(222,64,64,.08);border-radius:12px;padding:14px;margin-bottom:12px}
.rv p{font-family:Georgia,serif;font-size:17px;line-height:1.45;margin-bottom:8px}
.rv div{font-size:14px;margin-top:4px}
.rv .y{color:#ff8f8f}.rv .c{color:#7fdca4}
.perfect{border:1px solid var(--green);background:rgba(63,166,107,.12);border-radius:12px;padding:16px;text-align:center}
footer{text-align:center;padding:18px 12px;color:var(--gold);font-family:Georgia,serif;font-size:14px;letter-spacing:.5px;border-top:1px solid rgba(214,177,88,.3)}
.hide{display:none!important}
@media(max-width:560px){.brand small{display:none}.brand{font-size:18px}h1{font-size:27px}.qtext{font-size:19px}.panel{padding:18px}.pct{font-size:60px}.tag{font-size:10px;letter-spacing:1px}}
</style>
</head>

<script>
var Q=[{"t": "tf", "q": "Political breakdown begins when the legitimacy of a political regime erodes.", "a": true}, {"t": "tf", "q": "Nondemocratic regimes cannot enjoy significant public support.", "a": false}, {"t": "tf", "q": "Fear of political change or instability may encourage citizens to support nondemocratic regimes.", "a": true}, {"t": "tf", "q": "In nondemocratic regimes, citizens play a significant role in selecting and removing political leaders.", "a": false}, {"t": "tf", "q": "Totalitarianism seeks to establish total control over the institutions of the state, society and economy.", "a": true}, {"t": "tf", "q": "Coercion depends primarily on providing material benefits to citizens in exchange for political cooperation.", "a": false}, {"t": "tf", "q": "Surveillance aims to prevent political opposition from organizing and create uncertainty among citizens.", "a": true}, {"t": "tf", "q": "Co-optation may be more effective than coercion and violence in maintaining political regimes.", "a": true}, {"t": "tf", "q": "Corporatism encourages the establishment of independent organizations without state restrictions.", "a": false}, {"t": "tf", "q": "Clientelism relies on individual patronage rather than organizations representing large groups of people.", "a": true}, {"t": "tf", "q": "Personality cults attribute political failures to the leader and successes to the public.", "a": false}, {"t": "tf", "q": "Personal rule and totalitarianism are identical because both are based on a specific political ideology.", "a": false}, {"t": "tf", "q": "Military rule typically emerges through a coup d'état and usually lacks a specific political ideology.", "a": true}, {"t": "tf", "q": "Membership in a ruling political party is always based on ideological conviction.", "a": false}, {"t": "tf", "q": "Hybrid regimes may have democratic institutions that are unable to hold political leaders accountable.", "a": true}, {"t": "mc", "q": "Which of the following marks the beginning of political breakdown?", "o": ["Increased political participation", "Erosion of legitimacy", "Expansion of civil liberties", "Increased public support"], "a": 1}, {"t": "mc", "q": "Which of the following is NOT a reason why citizens may support nondemocratic regimes?", "o": ["Agreement with the regime's ideology", "Receiving direct benefits", "Fear of political instability", "Guaranteed freedom to remove political leaders"], "a": 3}, {"t": "mc", "q": "What distinguishes totalitarianism from other forms of nondemocratic rule?", "o": ["Its attempt to transform the entire institutional structure according to an ideological goal", "Its protection of individual liberties", "Its encouragement of independent political parties", "Its restriction of government intervention in society"], "a": 0}, {"t": "mc", "q": "Compelling individuals to obey by threatening harm to their lives or livelihoods is known as:", "o": ["Corporatism", "Clientelism", "Coercion", "Co-optation"], "a": 2}, {"t": "mc", "q": "What is one of the main objectives of political surveillance?", "o": ["Encouraging independent political organizations", "Preventing political opposition from organizing", "Increasing judicial independence", "Promoting political competition"], "a": 1}, {"t": "mc", "q": "A regime incorporates its political opponents into the system by offering them jobs and privileges. This is an example of:", "o": ["Surveillance", "Coercion", "Totalitarianism", "Co-optation"], "a": 3}, {"t": "mc", "q": "A government allows workers to join only one officially approved labor union. Which method of political control does this represent?", "o": ["Corporatism", "Clientelism", "Personality cults", "Whistle-blowing"], "a": 0}, {"t": "mc", "q": "What is the primary difference between corporatism and clientelism?", "o": ["Corporatism relies on violence, while clientelism relies on surveillance.", "Corporatism operates only in democracies.", "Corporatism operates through organizations, while clientelism relies on individual patronage.", "Clientelism prohibits the distribution of material benefits."], "a": 2}, {"t": "mc", "q": "A government provides specific goods to individuals in exchange for their votes. This practice is best described as:", "o": ["Corporatism", "Clientelism", "Coercion", "Technological surveillance"], "a": 1}, {"t": "mc", "q": "Which form of authority do personality cults attempt to generate?", "o": ["Judicial authority", "Constitutional authority", "Legislative authority", "Charismatic authority"], "a": 3}, {"t": "mc", "q": "What is the primary distinction between personal rule and totalitarianism?", "o": ["Ownership of the state versus an ideological system", "Surveillance versus political participation", "Religious authority versus military authority", "Elections versus political parties"], "a": 0}, {"t": "mc", "q": "Which of the following is a typical characteristic of military rule?", "o": ["Complete judicial independence", "Unlimited political competition", "Restrictions on civil liberties and political parties", "Government based on religious authority"], "a": 2}, {"t": "mc", "q": "Why are one-party regimes often divided into smaller units called cells?", "o": ["To establish independent opposition parties", "To operate at local levels, report to higher authorities and address local problems", "To eliminate communication between citizens and the ruling party", "To guarantee judicial independence"], "a": 1}, {"t": "mc", "q": "In which political system do rulers derive their authority from the claim that they govern on behalf of God?", "o": ["Military rule", "Personal rule", "One-party rule", "Theocracy"], "a": 3}, {"t": "mc", "q": "A country has regular elections, a legislature and a judiciary. However, elections are manipulated, the judiciary lacks independence and political leaders cannot be held accountable. How should this regime be classified?", "o": ["Illiberal or hybrid regime", "Liberal democracy", "Theocracy", "Military rule"], "a": 0}];
var TOTAL=Q.length;
var order,idx,score,wrong,answered,cur;
function $(i){return document.getElementById(i)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){["start","game","res"].forEach(function(s){$(s).classList.toggle("hide",s!==id)});window.scrollTo(0,0)}
var nTF=Q.filter(function(q){return q.t==="tf"}).length,nMC=TOTAL-nTF;
$("chips").innerHTML='<span class="chip">'+TOTAL+' Questions</span><span class="chip">'+nTF+' True / False</span><span class="chip">'+nMC+' Multiple Choice</span>';
function start(){order=shuffle(Q);idx=0;score=0;wrong=[];$("tag").textContent="QUIZ · "+TOTAL+" QUESTIONS";show("game");render()}
function build(q){
  if(q.t==="tf")return {opts:[{t:"True",c:q.a===true},{t:"False",c:q.a===false}]};
  return {opts:shuffle(q.o.map(function(t,i){return {t:t,c:i===q.a}}))};
}
function render(){
  answered=false;var q=order[idx];cur=build(q);
  $("qn").innerHTML="Question <b>"+(idx+1)+"</b> of "+TOTAL;
  $("sc").innerHTML="<b>"+score+"</b> correct";
  $("qt").textContent=(q.t==="tf"?"True or False: ":"")+q.q;
  $("prog").style.width=(idx/TOTAL*100)+"%";
  $("fb").innerHTML="";$("next").classList.add("hide");
  var h="";cur.opts.forEach(function(o,i){h+='<button class="opt" data-i="'+i+'"><span class="l">'+"ABCD"[i]+'</span><span></span></button>'});
  $("opts").innerHTML=h;
  var b=$("opts").children;for(var i=0;i<b.length;i++){b[i].lastChild.textContent=cur.opts[i].t;(function(i){b[i].onclick=function(){pick(i)}})(i)}
}
function pick(i){
  if(answered)return;answered=true;var q=order[idx],ok=cur.opts[i].c;
  var ci=cur.opts.findIndex(function(o){return o.c});
  var b=$("opts").children;
  for(var k=0;k<b.length;k++){b[k].disabled=true;b[k].classList.add(k===ci?"ok":(k===i?"bad":"fade"))}
  if(ok)score++;else wrong.push({q:q.q,mine:cur.opts[i].t,right:cur.opts[ci].t,tf:q.t==="tf"});
  $("sc").innerHTML="<b>"+score+"</b> correct";
  $("fb").innerHTML='<div class="fb '+(ok?"ok":"bad")+'"><b>'+(ok?"Correct":"Not quite")+'</b>'+(ok?"":"Correct answer: "+"ABCD"[ci]+". ")+'</div>';
  if(!ok)$("fb").firstChild.appendChild(document.createTextNode(cur.opts[ci].t));
  $("prog").style.width=((idx+1)/TOTAL*100)+"%";
  var n=$("next");n.textContent=idx===TOTAL-1?"See result":"Next question";n.classList.remove("hide");n.focus();
}
function finish(){
  show("res");$("tag").textContent="RESULTS";$("prog").style.width="100%";
  $("pct").textContent=Math.round(score/TOTAL*100)+"%";
  $("rs").textContent=score+" / "+TOTAL+" correct";
  var r=$("review");r.innerHTML="";
  if(!wrong.length){r.innerHTML='<div class="perfect">Perfect score! You answered every question correctly.</div>';return}
  var h=document.createElement("h2");h.textContent="Questions you answered incorrectly ("+wrong.length+")";r.appendChild(h);
  wrong.forEach(function(w,i){
    var d=document.createElement("div");d.className="rv";
    var p=document.createElement("p");p.textContent=(i+1)+". "+w.q;d.appendChild(p);
    var a=document.createElement("div");a.className="y";a.textContent="Your answer: "+w.mine;d.appendChild(a);
    var c=document.createElement("div");c.className="c";c.textContent="Correct answer: "+w.right;d.appendChild(c);
    r.appendChild(d);
  });
}
$("go").onclick=start;$("again").onclick=start;
$("next").onclick=function(){if(idx===TOTAL-1)finish();else{idx++;render()}};
document.addEventListener("keydown",function(e){
  if(!$("game").classList.contains("hide")){
    var k="abcd".indexOf(e.key.toLowerCase());
    if(!answered&&k>-1&&k<cur.opts.length)pick(k);
    else if(answered&&e.key==="Enter"&&e.target.id!=="next")$("next").click();
  }
});
</script>
</body>
</html>
