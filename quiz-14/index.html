<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Political Quiz 14 · Center JUST</title>
<style>
:root{--navy:#060E24;--blue:#2454BE;--gold:#D6B158;--txt:#F4F7FC;--mut:#A9B6D3;--green:#3FA66B;--red:#DE4040}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--txt);background:var(--navy);display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 100% 0%,rgba(36,84,190,.45),transparent 55%),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45)),var(--navy)}
.serif{font-family:Georgia,"Times New Roman",serif}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid rgba(214,177,88,.6)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:46px;height:46px;object-fit:contain}
.brand b{font-family:Georgia,serif;font-size:20px;letter-spacing:.08em;display:block;line-height:1.1}
.brand small{color:var(--mut);font-size:11px;letter-spacing:.06em}
.lbl{color:var(--gold);font-size:11px;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
#bar{height:3px;background:rgba(214,177,88,.15)}#bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:28px 18px}
.panel{background:rgba(14,26,58,.62);border:1px solid rgba(214,177,88,.45);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.45);padding:26px;backdrop-filter:blur(6px)}
.center{text-align:center}
.hero img{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 4px 18px rgba(36,84,190,.6))}
.hero .cj{font-family:Georgia,serif;font-size:26px;letter-spacing:.14em;margin-top:4px}
h1{font-family:Georgia,serif;font-size:32px;font-weight:700;margin:14px 0 6px}
.line{width:70px;height:2px;background:var(--gold);margin:14px auto}
.sub{color:var(--mut);font-size:16px;line-height:1.5}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.chip{border:1px solid rgba(214,177,88,.5);border-radius:12px;padding:10px 16px;min-width:90px}
.chip b{display:block;font-family:Georgia,serif;font-size:24px;color:var(--gold)}
.chip span{font-size:12px;color:var(--mut)}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(180deg,#e3c474,var(--gold));color:#1a1405;border:0;border-radius:12px;padding:14px 34px;font-weight:700;font-size:17px;letter-spacing:.04em;transition:transform .15s,box-shadow .2s;box-shadow:0 6px 18px rgba(214,177,88,.25)}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(214,177,88,.4)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:14px}
.meta b{color:var(--gold)}
.q{font-family:Georgia,serif;font-size:23px;line-height:1.45;margin-bottom:20px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(214,177,88,.35);color:var(--txt);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:16.5px;line-height:1.4;min-height:56px;transition:all .2s}
.opt:not(:disabled):hover{background:rgba(214,177,88,.12);border-color:var(--gold);transform:translateX(4px)}
.badge{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700}
.opt.ok{background:rgba(63,166,107,.22);border-color:var(--green);animation:pop .35s}
.opt.ok .badge{background:var(--green);border-color:var(--green);color:#fff}
.opt.no{background:rgba(222,64,64,.2);border-color:var(--red);animation:shake .4s}
.opt.no .badge{background:var(--red);border-color:var(--red);color:#fff}
.opt.dim{opacity:.4}
@keyframes pop{50%{transform:scale(1.02)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-radius:12px;padding:14px 16px;margin:14px 0;font-size:16px;line-height:1.5}
.fb.ok{background:rgba(63,166,107,.15);border:1px solid var(--green)}
.fb.no{background:rgba(222,64,64,.13);border:1px solid var(--red)}
.fb b{font-family:Georgia,serif;font-size:18px}
.right{text-align:right}
.big{font-family:Georgia,serif;font-size:72px;color:var(--gold);line-height:1}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.rev{margin-top:10px;text-align:left}
.rev h2{font-family:Georgia,serif;font-size:22px;margin:18px 0 10px;color:var(--gold)}
.ri{border:1px solid rgba(222,64,64,.55);background:rgba(222,64,64,.07);border-radius:12px;padding:14px 16px;margin-bottom:10px;line-height:1.5}
.ri .qq{font-family:Georgia,serif;font-size:17px;margin-bottom:8px}
.ri .y{color:#ff8f8f}.ri .c{color:#7fdca3}
.perfect{border:1px solid var(--green);background:rgba(63,166,107,.12);border-radius:12px;padding:16px;text-align:center}
footer{text-align:center;padding:18px 12px 22px;color:var(--gold);font-size:13px;letter-spacing:.08em;border-top:1px solid rgba(214,177,88,.3)}
.hide{display:none}
@media(max-width:560px){.brand small{display:none}.brand b{font-size:17px}.lbl{font-size:10px;letter-spacing:.12em}header{padding:10px 12px}.panel{padding:18px}h1{font-size:25px}.q{font-size:20px}.big{font-size:58px}main{padding:18px 12px}}
</style></head><body>

var QS=[{"t": "tf", "q": "Political violence involves the use of force to achieve political objectives.", "a": true}, {"t": "tf", "q": "All violent incidents during football matches are considered political violence.", "a": false}, {"t": "tf", "q": "Institutional explanations suggest that political violence may result from institutions that restrict political participation.", "a": true}, {"t": "tf", "q": "Ideational explanations focus exclusively on the psychological feelings of individuals.", "a": false}, {"t": "tf", "q": "Rational choice theory considers political violence a calculated strategy based on costs and benefits.", "a": true}, {"t": "tf", "q": "Public participation is an essential element of revolution.", "a": true}, {"t": "tf", "q": "Removing a political leader without changing the existing regime necessarily constitutes a revolution.", "a": false}, {"t": "tf", "q": "Revolutions are more likely to occur in democratic regimes because citizens participate in political life.", "a": false}, {"t": "tf", "q": "A major revolutionary transformation can occur without widespread violence.", "a": true}, {"t": "tf", "q": "Revolutionary leaders may centralize political power after achieving victory to protect their political gains.", "a": true}, {"t": "tf", "q": "Military coups are primarily driven from below through mass public participation.", "a": false}, {"t": "tf", "q": "Military governments frequently face problems of political legitimacy and political competence.", "a": true}, {"t": "tf", "q": "The primary objective of civil wars is usually financial profit rather than political control.", "a": false}, {"t": "tf", "q": "Negotiated peace accords and external armed intervention are possible mechanisms for ending civil wars.", "a": true}, {"t": "tf", "q": "State terrorism can only be directed against the citizens of the state that conducts it.", "a": false}, {"t": "mc", "q": "What distinguishes political violence from general violence?", "o": ["The number of participants", "The existence of political motivation", "The geographical location", "The duration of violence"], "a": 1}, {"t": "mc", "q": "Which explanation of political violence emphasizes political exclusion and marginalization?", "o": ["Psychological explanation", "Rational choice explanation", "Ideational explanation", "Institutional explanation"], "a": 3}, {"t": "mc", "q": "Which explanation emphasizes feelings of humiliation, alienation, and frustration?", "o": ["Psychological explanation", "Institutional explanation", "Ideational explanation", "Rational choice explanation"], "a": 0}, {"t": "mc", "q": "A group uses nationalism to unite its members around a greater political cause. Which explanation best applies?", "o": ["Institutional explanation", "Psychological explanation", "Ideational explanation", "Administrative explanation"], "a": 2}, {"t": "mc", "q": "Which of the following is NOT a form of political violence?", "o": ["Assassination", "Military coup", "Competitive elections", "Civil war"], "a": 2}, {"t": "mc", "q": "Which combination represents the three essential elements of revolution?", "o": ["Public participation, seizure of the entire state, and removal of the regime", "Military participation, local independence, and constitutional reform", "Foreign intervention, economic development, and leadership change", "Political negotiation, military dominance, and electoral competition"], "a": 0}, {"t": "mc", "q": "A public uprising successfully removes a president, but the existing political system remains unchanged. This is best described as:", "o": ["A revolution", "A civil war", "A military coup", "A rebellion"], "a": 3}, {"t": "mc", "q": "Which country represents an example of revolutionary transformation achieved through mass civilian mobilization and sustained political negotiations without widespread violence?", "o": ["Cuba", "South Africa", "Russia", "Iran"], "a": 1}, {"t": "mc", "q": "Why might revolutionary leaders re-centralize political power after overthrowing an existing regime?", "o": ["To eliminate all government institutions", "To guarantee immediate democratic elections", "To protect their political gains against internal and external threats", "To abandon their political objectives"], "a": 2}, {"t": "mc", "q": "What is the fundamental difference between a revolution and a military coup?", "o": ["Revolutions always fail, while military coups always succeed.", "Revolutions are driven from below, while military coups are carried out from above.", "Military coups require greater public participation than revolutions.", "Revolutions seek only to replace individual leaders."], "a": 1}, {"t": "mc", "q": "Which of the following is a strategy military governments may employ to address their crisis of legitimacy?", "o": ["Appointing non-political civilian technocrats", "Eliminating all administrative institutions", "Abolishing public services", "Rejecting all forms of civilian participation"], "a": 0}, {"t": "mc", "q": "Why may military officers encounter difficulties in managing civilian political affairs?", "o": ["They lack organizational structures.", "They have no experience exercising authority.", "They depend entirely on competitive elections.", "Their hierarchical training may limit their negotiation and compromise skills."], "a": 3}, {"t": "mc", "q": "When foreign powers support opposing factions in a civil war to pursue their own interests, the conflict may be described as:", "o": ["A rebellion", "A proxy war", "A peaceful revolution", "A military coup"], "a": 1}, {"t": "mc", "q": "Which of the following is NOT a humanitarian consequence of civil wars?", "o": ["Mass civilian displacement", "Infrastructure destruction", "Increased social cohesion", "Famine"], "a": 2}, {"t": "mc", "q": "A government deliberately uses fear and intimidation against the citizens of another country to force political concessions. This is best classified as:", "o": ["State terrorism", "Non-state terrorism", "Civil disobedience", "Negotiated diplomacy"], "a": 0}];

function start(){order=shuffle(QS.map(function(_,i){return i}));idx=0;score=0;wrong=[];show()}

 if(locked)return;locked=true;
 var o=cur.opts,good=o[i].c,bs=app.querySelectorAll('.opt'),ci=o.findIndex(function(x){return x.c});
