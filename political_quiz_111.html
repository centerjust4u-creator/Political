<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Political Quiz 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#10192E;--parchment:#F3ECD9;--brass:#C9A227;--brass-bright:#E4C158;--ink:#201A10;--correct:#2E5FA3;--correct-dim:#163459;--wrong:#B23B32;--wrong-dim:#5E1F1A;--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Work Sans',-apple-system,Segoe UI,Roboto,sans-serif;box-sizing:border-box}
*{box-sizing:inherit}html,body{height:100%;margin:0}body{font-family:var(--sans);background:radial-gradient(circle at 15% -10%,#22315A 0%,transparent 45%),radial-gradient(circle at 110% 110%,#22315A 0%,transparent 40%),var(--navy);color:var(--parchment);min-height:100%;display:flex;justify-content:center;overflow-x:hidden}.stage{width:100%;max-width:720px;padding:28px 20px 48px;display:flex;flex-direction:column;gap:20px;min-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.seal{width:46px;height:46px;border-radius:50%;border:2px solid var(--brass);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#F3ECD9;overflow:hidden}.seal img,.intro .big-seal img,.verdict-seal img{width:100%;height:100%;object-fit:cover;display:block}.brand-text h1{font-family:var(--serif);font-weight:600;font-size:20px;margin:0}.brand-text p{margin:2px 0 0;font-size:12.5px;color:#9FAFCB}.tally{font-family:var(--serif);font-size:15px;color:var(--brass-bright);text-align:right;white-space:nowrap}.tally span{display:block;font-family:var(--sans);font-size:11px;color:#8494B4;font-weight:500}
.progress-row{display:flex;gap:4px;flex-wrap:wrap}.box{flex:1 1 0;min-width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.08)}.box.done-correct{background:var(--correct)}.box.done-wrong{background:var(--wrong)}.box.current{background:var(--brass)}
.card{background:var(--parchment);color:var(--ink);border-radius:14px;padding:28px 26px 26px;box-shadow:0 20px 50px rgba(0,0,0,.35);flex:1;display:flex;flex-direction:column;position:relative}.card::before,.verdict::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--brass),#8C6E1A,var(--brass))}.kicker{font-size:12px;font-weight:600;color:#7A6A34;margin-bottom:6px}.prompt{font-family:var(--serif);font-size:22px;line-height:1.35;font-weight:600;margin:0 0 22px}.options{display:flex;flex-direction:column;gap:10px}.opt-btn{text-align:left;border:1.5px solid #CBB98A;background:#FBF7EC;color:var(--ink);border-radius:10px;padding:14px 16px;font-family:var(--sans);font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:12px}.opt-letter{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:1.5px solid #CBB98A;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#7A6A34}.opt-btn.correct-pick{background:var(--correct);border-color:var(--correct);color:#EAF1FC}.opt-btn.wrong-pick{background:var(--wrong);border-color:var(--wrong);color:#FCEBE9}.opt-btn.reveal-correct-unpicked{border-color:var(--correct);color:var(--correct-dim);background:#E4EDF9}.opt-btn.dim{opacity:.55}.feedback{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:14px;line-height:1.5;display:none}.feedback.show{display:block}.feedback.correct{background:#E4EDF9;border:1px solid var(--correct);color:var(--correct-dim)}.feedback.wrong{background:#F8E6E4;border:1px solid var(--wrong);color:var(--wrong-dim)}.card-footer{margin-top:auto;padding-top:20px;display:flex;justify-content:flex-end}.next-btn{background:var(--navy);color:var(--brass-bright);border:0;border-radius:999px;padding:12px 26px;font-weight:600;cursor:pointer;opacity:0;pointer-events:none}.next-btn.show{opacity:1;pointer-events:auto}
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:22px;padding:20px 6px}.intro .big-seal{width:108px;height:108px;margin:0 auto;border-radius:50%;border:2.5px solid var(--brass);background:#F3ECD9;overflow:hidden}.intro h2{font-family:var(--serif);font-size:32px;margin:0}.intro p{color:#B7C3DE;font-size:15px;line-height:1.6}.rules{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.rule-chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 16px;font-size:12.5px;color:#C9D3EA;min-width:130px}.rule-chip b{display:block;font-family:var(--serif);color:var(--brass-bright);font-size:16px}.start-btn,.again-btn{background:linear-gradient(180deg,var(--brass-bright),var(--brass));color:#211804;border:0;border-radius:999px;padding:15px 34px;font-weight:700;font-size:15px;cursor:pointer;margin:8px auto 0;box-shadow:0 10px 24px rgba(201,162,39,.35)}
.results{flex:1;display:flex;flex-direction:column;gap:18px}.verdict{background:var(--parchment);color:var(--ink);border-radius:14px;padding:30px 26px;text-align:center;position:relative;overflow:hidden}.verdict-seal{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;border:2px solid var(--navy);overflow:hidden}.score-big{font-family:var(--serif);font-size:34px;font-weight:700;margin:6px 0;color:var(--navy)}.score-label{font-size:12.5px;color:#7A6A34;font-weight:600}

{type:'tf',prompt:"Politics is defined as the struggle for influence that occurs only within an entire nation.",answer:false,explain:"Politics arises inside any group — a family, a club, a company — not only within whole nations."},
{type:'tf',prompt:"The basic struggle in politics has always been the battle between freedom and authority.",answer:true,explain:"That tension — how much individuals may act on their own versus how much a governing power may command — sits at the center of political life."},
{type:'tf',prompt:"Authority is defined as the ability to influence others or impose one's own will upon them.",answer:false,explain:"That description fits power. Authority is narrower: a right, tied to rank or office, to issue commands and enforce them."},
{type:'tf',prompt:"Institutions are merely physical structures and buildings.",answer:false,explain:"Institutions are norms and values embedded in people's lives — buildings may house them, but they are not the institution itself."},
{type:'tf',prompt:"People adhere to institutions solely because it serves their self-interest.",answer:false,explain:"People defend institutions because they feel central to their lives and lend legitimacy — not from self-interest alone."},
{type:'tf',prompt:"The society is defined as the organization that maintains a monopoly of violence over a specific territory.",answer:false,explain:"That is the definition of the state, not society."},
{type:'tf',prompt:"Legitimacy means a state can act independently of external actors and internal rivals within its territory.",answer:false,explain:"Acting independently of external and internal rivals describes sovereignty, not legitimacy."},
{type:'tf',prompt:"To maintain control, a state needs both armed forces for international threats and a police force for domestic ones.",answer:true,explain:"Armed forces guard against outside rivals while police maintain order within the territory."},
{type:'tf',prompt:"States are not strongly institutionalized and change easily whenever new leaders come to power.",answer:false,explain:"States are, in fact, strongly institutionalized — they persist through crises, turmoil, and changes in leadership."},
{type:'tf',prompt:"The complexity of politics in a group depends on factors like the number of its members and the resources available.",answer:true,explain:"More members and more (or scarcer) resources tend to make the political struggle within a group more complex."},
{type:'tf',prompt:"The core of politics is finding a way to reconcile the conflicting ideals of freedom and authority.",answer:true,explain:"Balancing individual freedom against the need for authority is the recurring project of politics."},
{type:'tf',prompt:"Power is defined as the ability to act independently without fear of punishment.",answer:false,explain:"Acting independently without fear of punishment describes freedom, not power."},
{type:'tf',prompt:"Greater personal freedom usually means a larger, more powerful role for authority.",answer:false,explain:"The two trade off against each other — more personal freedom generally means a smaller role for authority, and vice versa."},
{type:'tf',prompt:"Once established, institutions are generally weak and easy to change or remove.",answer:false,explain:"Institutions are usually deeply embedded and resistant to change once established."},
{type:'tf',prompt:"According to political scientists, politics is the struggle for the power to make decisions that affect the public.",answer:true,explain:"This is the standard definition: politics is the contest over who gets to make binding public decisions."},
{type:'tf',prompt:"The concepts of politics and power are considered separate and unrelated.",answer:false,explain:"They are closely linked — politics is largely the struggle over who holds and exercises power."},
{type:'tf',prompt:"People defend threatened institutions because they are seen as central to their lives and a source of legitimacy.",answer:true,explain:"When an institution feels essential and lends legitimacy to daily life, people rally to protect it."},
{type:'tf',prompt:'The term "the state" universally refers to local, non-centralized politics.',answer:false,explain:'The state refers to the centralized organization holding a monopoly of violence over a territory — the opposite of local, non-centralized politics.'},
{type:'tf',prompt:"A state's responsibilities are limited only to defense and policing.",answer:false,explain:"Defense and policing are core tools of control, but a state's responsibilities extend well beyond only those two."},
{type:'tf',prompt:"Leaders and policies are more permanent and institutionalized than the state itself.",answer:false,explain:"It's the reverse: the state outlasts particular leaders and policies, which come and go."},
{type:'mcq',prompt:"Politics inevitably exists in any group to:",options:["Eliminate all conflict permanently.","Reconcile the conflicting interests of the group's members.","Establish a single, superior authority without question.","Ensure that everyone in the group has equal power."],answer:1,explain:"Politics is the ongoing process of reconciling members' competing interests — not eliminating conflict or guaranteeing equality."},
{type:'mcq',prompt:'"Authority" is defined as:',options:["The ability to act independently without fear of restriction.","The popular acceptance of a leader among citizens.","A power or right, due to rank or office, to issue commands and punish violations.","The struggle for influence within a group."],answer:2,explain:"Authority is a right attached to rank or office — the legitimate power to command and to punish violations of that command."},
{type:'mcq',prompt:"What is the relationship between personal freedom and authority?",options:["Greater personal freedom implies a larger role for authority.","They are unrelated concepts in politics.","They are in an eternal battle, and politics seeks to find a balance between them.","Authority exists to completely remove personal freedom."],answer:2,explain:"Freedom and authority pull against each other, and politics is largely the ongoing search for balance between them."},
{type:'mcq',prompt:'Which of the following best describes an "institution"?',options:["A physical building where political decisions are made.","A temporary set of rules that changes with every new leader.","Something deeply embedded in people's lives as a norm or value that is not easily changed.","A small organization with limited influence."],answer:2,explain:"Institutions are durable norms and values woven into daily life — that's why they resist easy change."},
{type:'mcq',prompt:'The "State" is defined primarily as:',options:["The government that is currently in power.","An organization that maintains a monopoly of violence over a territory.","Any group of people with a shared culture.","The set of elected officials in a country."],answer:1,explain:"The defining feature of a state is its monopoly of violence over a given territory."},
{type:'mcq',prompt:'"Sovereignty" is the ability of a state to:',options:["Form alliances with other powerful countries.","Carry out actions and policies within its territory, independent of external and internal rivals.","Hold elections to choose its leaders.","Control the economic resources of its territory."],answer:1,explain:"Sovereignty means acting within one's territory free from the interference of outside powers or internal rivals."},
{type:'mcq',prompt:"Why does a state need both armed forces and a police force?",options:["To protect against international rivals and domestic rivals, respectively.","To ensure that all citizens obey traffic laws.","To have a parade and display its power.","To force citizens to serve in the military."],answer:0,explain:"Armed forces answer threats from outside the territory; police forces answer threats from within it."},
{type:'mcq',prompt:"Institutions influence politics by:",options:["Remaining completely neutral and not affecting political activity.","Generating norms and values that favor certain political activities and condemn others.","Only existing in physical forms like the military and police.","Being easily dismantled and changed by individual politicians."],answer:1,explain:"Institutions shape which political behaviors are seen as acceptable and which are condemned, steering activity accordingly."},
{type:'mcq',prompt:"The complexity of politics within a group does NOT depend on:",options:["The number of people in the group.","The personal preferences of every single member.","The sources and resources available to the group.","The degree of knowledge of its members."],answer:1,explain:"Size, resources, and members' knowledge all shape political complexity — but tracking every individual's personal preference is not one of the stated factors."},
{type:'mcq',prompt:"Which statement truly represents the state?",options:["The state changes every time a new leader is elected.","The state is less permanent than its leaders and policies.","The state remains, even in the face of crisis, turmoil, or revolution.","The state can be easily destroyed by a small group of opponents."],answer:2,explain:"The state's institutionalized durability lets it persist through crises and turmoil that topple particular leaders."}

let order=[],current=0,score=0,answered=[],locked=false;
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e}
function renderIntro(){const s=document.getElementById('stage');s.innerHTML=`<div class="intro"><div class="big-seal"><img src="${LOGO_SRC}"></div><h2>Political Quiz 1</h2><p>Welcome to Center JUST, please answer the following questions.</p><div class="rules"><div class="rule-chip"><b>20</b>True / False</div><div class="rule-chip"><b>10</b>Multiple choice</div></div><button class="start-btn" id="startBtn">Start Quiz</button></div>`;document.getElementById('startBtn').onclick=startGame}
function startGame(){order=shuffle(QUESTIONS.map((q,i)=>i));current=0;score=0;answered=[];renderGame()}
function renderGame(){const s=document.getElementById('stage');s.innerHTML='';const header=el('div','header',`<div class="brand"><div class="seal"><img src="${LOGO_SRC}"></div><div class="brand-text"><h1>Political Quiz 1</h1><p>Question ${current+1} of ${order.length}</p></div></div><div class="tally">${score} / ${answered.length}<span>correct so far</span></div>`);s.appendChild(header);const progress=el('div','progress-row');order.forEach((x,i)=>{const b=el('div','box');if(i<answered.length)b.classList.add(answered[i]?'done-correct':'done-wrong');else if(i===current)b.classList.add('current');progress.appendChild(b)});s.appendChild(progress);const q=QUESTIONS[order[current]],card=el('div','card');card.appendChild(el('div','kicker',q.type==='tf'?'True or False':'Multiple Choice'));card.appendChild(el('div','prompt',q.prompt));const wrap=el('div','options'),feedback=el('div','feedback'),footer=el('div','card-footer'),next=el('button','next-btn',current===order.length-1?'See your results':'Next question');footer.appendChild(next);locked=false;const opts=q.type==='tf'?[{label:'True',letter:'T',isCorrect:q.answer===true},{label:'False',letter:'F',isCorrect:q.answer===false}]:q.options.map((o,i)=>({label:o,letter:['A','B','C','D'][i],isCorrect:i===q.answer}));const refs=[];opts.forEach(o=>{const b=el('button','opt-btn',`<span class="opt-letter">${o.letter}</span><span>${o.label}</span>`);b.onclick=()=>{if(locked)return;locked=true;answered.push(o.isCorrect);if(o.isCorrect)score++;refs.forEach(r=>{r.b.disabled=true;if(r.o===o)r.b.classList.add(o.isCorrect?'correct-pick':'wrong-pick');else if(r.o.isCorrect)r.b.classList.add('reveal-correct-unpicked');else r.b.classList.add('dim')});feedback.classList.add('show',o.isCorrect?'correct':'wrong');feedback.innerHTML=`<b>${o.isCorrect?'Correct.':'Not quite.'}</b><br>${q.explain}`;next.classList.add('show');header.querySelector('.tally').innerHTML=`${score} / ${answered.length}<span>correct so far</span>`};refs.push({b,o});wrap.appendChild(b)});card.append(wrap,feedback,footer);s.appendChild(card);next.onclick=()=>{if(!locked)return;if(current===order.length-1)renderResults();else{current++;renderGame()}}}
function renderResults(){const s=document.getElementById('stage');s.innerHTML=`<div class="results"><div class="verdict"><div class="verdict-seal"><img src="${LOGO_SRC}"></div><div class="score-label">FINAL SCORE</div><div class="score-big">${score} / ${order.length}</div><button class="again-btn" id="againBtn">Restart the Quiz</button></div></div>`;document.getElementById('againBtn').onclick=startGame}
renderIntro();
</script></body></html>
